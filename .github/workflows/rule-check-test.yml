name: rule-check-test

on:
  workflow_dispatch:

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report repository stats
        run: |
          echo "## Repository stats" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| item | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| repo | ${GITHUB_REPOSITORY} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ref | ${GITHUB_REF} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| sha | ${GITHUB_SHA} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| runner | ${RUNNER_OS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| event | ${GITHUB_EVENT_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| actor | ${GITHUB_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "done" >> "$GITHUB_STEP_SUMMARY"
