name: "🏷️ Release Please"

# reusable workflow を参照するためのリリースタグ (vX.Y.Z) を、手動実行で作る。
# 実行すると main の Conventional Commits からリリース PR を作成・更新し、リリース PR のマージ後に
# もう一度実行するとタグと GitHub Release を作る。手順とバージョンの付け方は docs/SETUP.md の「5.」を参照。
on:
  workflow_dispatch:

permissions: {}

# リリース PR の更新が前後しないよう、実行中の run は止めずに直列化する
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: "リリース PR・タグの作成"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    # 実行ブランチは選べるため、main 以外からの実行ではトークンを発行しない
    if: github.ref == 'refs/heads/main'
    steps:
      # GITHUB_TOKEN は org 設定で PR を作れず、作れても PR で必須ワークフローが起動しないため App トークンを使う
      - name: "App トークン発行"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # リリース PR へのラベル付け (autorelease: pending など) に必要
          permission-issues: write

      - name: "Release Please"
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
