name: "🕷️ DAST"

# PR のコードからアプリを起動し、ZAP で攻撃してスキャンする必須ワークフロー（設計: docs/DAST.md）。
#   - 画面 (type: web): クロール + 受動スキャン
#   - API  (type: api): OpenAPI から全エンドポイントを能動スキャン
#
# 検知ポリシー（Medium 以上で失敗）は composite action で固定する。
# 抑制は .github/dast.yml の ignores だけで行い、変更にはセキュリティチームの承認が要る（ZAP にインラインの抑制は無い）。
#
# Required workflow は inputs を受け取れないため、起動方法とスキャン対象は repo の .github/dast.yml で決める。
# 無い repo では skip する（run は成功）。paths のフィルタは無く、ある repo では全 PR でスキャンする。
# 書式と動作は .github/actions/dast を参照（action を変えたら、下の uses の SHA も上げる）

# main への直 push はルールセットで禁止されているため、PR だけを対象にする
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# 同じ PR で新しい push があれば、古い run をキャンセルする
concurrency:
  group: dast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # action を変えずにイメージだけ上げられるよう、ここで固定する
  # renovate: datasource=docker depName=ghcr.io/zaproxy/zaproxy
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6

jobs:
  scan:
    name: "起動したアプリをスキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ZAP は 13 分で打ち切る。残りはビルド・起動・レポートの保存
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "設定ファイルを探す"
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/dast.yml ] && [ -f .github/dast.yaml ]; then
            echo "::error file=.github/dast.yaml::.github/dast.yml と .github/dast.yaml は併用できません。どちらか一方にまとめてください"
            exit 1
          fi
          for f in .github/dast.yml .github/dast.yaml; do
            if [ -f "${f}" ]; then echo "file=${f}" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo ".github/dast.yml が無いため、スキャンしない"

      - name: "DAST"
        if: steps.config.outputs.file != ''
        # 必須ワークフローは対象 repo で動くため、この repo の action はパスではなく SHA で参照する
        uses: theindiehacker/devops/.github/actions/dast@5e258ec39c03c69fa6a2e6fb68e45bfcf1550626
        with:
          config: ${{ steps.config.outputs.file }}
          zap-image: ${{ env.ZAP_IMAGE }}
          work-dir: ${{ runner.temp }}/dast

      - name: "レポートを artifact に保存"
        # 検知して失敗してもレポートは残す。log の保持期間が切れても後から調べられるようにする
        if: ${{ !cancelled() && steps.config.outputs.file != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dast-report
          path: ${{ runner.temp }}/dast/report
          if-no-files-found: ignore
          retention-days: 30
