name: "🛡️ Trivy スキャン"

# 全 repo に適用する必須ワークフロー。PR ごとに次の 2 つを検査する:
#   - scan-fs:    依存パッケージの脆弱性と IaC の設定ミス
#   - scan-image: Dockerfile からビルドしたイメージの脆弱性（Dockerfile が無い repo では skip）
#
# 検知ポリシー（HIGH 以上 / 修正版がある脆弱性のみ / 検知したら失敗）はここで固定する。
# repo 側は trivy.yaml の severity で検知を「増やす」ことだけができる。
# 抑制は承認必須の .trivyignore / .trivyignore.yaml だけで行い、インライン ignore は禁止する。
#
# Required workflow は inputs を受け取れないため、イメージのビルド方法は規約で決める:
#   - .github/trivy-image.yml があれば、列挙された image だけをビルドする
#   - 無ければ Dockerfile / Dockerfile.* / *.Dockerfile を自動検出し、置き場所を build context にする
#
# .github/trivy-image.yml の書式（ビルドに secrets が必要な repo は images: [] で opt-out する）:
#   images:
#     - dockerfile: backend/Dockerfile  # 必須。repo ルートからの相対パス
#       context: backend                # 任意。省略時は dockerfile のあるディレクトリ
#       target: api                     # 任意。multi-stage のビルド対象ステージ
#       build-args:                     # 任意
#         INFRASTRUCTURE: gcp

# main への直 push はルールセットで禁止されているため、PR だけを対象にする
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# 同じ PR で新しい push があれば、古い run をキャンセルする
concurrency:
  group: trivy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: "スキャン対象・ポリシーを決定"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      severity: ${{ steps.policy.outputs.severity }}
      trivyignores: ${{ steps.policy.outputs.trivyignores }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "検知する severity / 抑制ファイルを決定"
        id: policy
        shell: bash
        run: |
          set -euo pipefail

          # --- severity: 組織の下限 HIGH,CRITICAL に repo の trivy.yaml の指定を足す ---
          # （CLI 引数は設定ファイルより優先されるため、repo 側から下限を弱めることはできない）
          levels=(CRITICAL HIGH)
          for cfg in trivy.yaml trivy.yml; do
            [ -f "${cfg}" ] || continue
            # severity は "HIGH,MEDIUM" 形式の文字列でも配列でも書ける。
            # 一度変数に受けるのは、yq / jq の失敗を set -e で拾うため
            raw=$(yq --output-format=json '.severity // []' "${cfg}" \
              | jq -r '[.] | flatten | map(tostring) | join(",") | ascii_upcase | gsub(" "; "")')
            IFS=, read -ra extra <<<"${raw}"
            for level in "${extra[@]}"; do
              case "${level}" in
                "") ;;
                UNKNOWN|LOW|MEDIUM|HIGH|CRITICAL) levels+=("${level}") ;;
                *) echo "::error file=${cfg}::severity に不正な値があります: ${level}"; exit 1 ;;
              esac
            done
            break
          done
          severity=$(printf '%s\n' "${levels[@]}" | sort -u | paste -sd, -)

          # --- 抑制ファイル: Trivy が既定で読むのは .trivyignore だけなので、YAML 版は明示的に渡す ---
          # （trivy-action は形式の違う 2 ファイルを併用できないため、両方あればエラーにする）
          trivyignores=""
          if [ -f .trivyignore.yaml ]; then
            if [ -f .trivyignore ]; then
              echo "::error file=.trivyignore.yaml::.trivyignore と .trivyignore.yaml は併用できません。どちらか一方にまとめてください"
              exit 1
            fi
            trivyignores=".trivyignore.yaml"
          fi

          echo "severity=${severity}" >> "$GITHUB_OUTPUT"
          echo "trivyignores=${trivyignores}" >> "$GITHUB_OUTPUT"
          echo "検知する severity: ${severity}"
          echo "抑制ファイル: ${trivyignores:-.trivyignore（Trivy 既定）}"

      - name: "スキャンするイメージを決定"
        id: images
        shell: bash
        run: |
          set -euo pipefail

          manifest=""
          for f in .github/trivy-image.yml .github/trivy-image.yaml; do
            if [ -f "${f}" ]; then manifest="${f}"; break; fi
          done

          # 1. ビルドするイメージの一覧を作る（マニフェスト優先。無ければ Dockerfile を自動検出）
          if [ -n "${manifest}" ]; then
            echo "${manifest} に列挙されたイメージをスキャンする"
            list=$(yq --output-format=json '.images // []' "${manifest}")
          else
            echo "Dockerfile を自動検出してスキャンする"
            # Dockerfile.dockerignore（buildx の Dockerfile 別 ignore ファイル）は Dockerfile ではないので除外する
            list=$(
              find . -path ./.git -prune -o -type f \
                \( -name 'Dockerfile' -o -name 'Dockerfile.*' -o -name '*.Dockerfile' \) \
                ! -name '*.dockerignore' -print \
                | sed 's|^\./||' | sort | jq --raw-input '{dockerfile: .}' | jq --slurp --compact-output .
            )
          fi

          # 2. matrix で使う形に整える（label は job 名、suffix は cache scope / artifact 名に使う）
          images=$(jq --compact-output '
            map(
              (.dockerfile // "") as $df | (.target // "") as $target |
              {
                dockerfile: $df,
                context: (.context // ($df | split("/") | .[:-1] | join("/") | if . == "" then "." else . end)),
                target: $target,
                build_args: (.["build-args"] // {} | to_entries | map("\(.key)=\(.value)") | join("\n")),
                label: ($df + (if $target == "" then "" else " (\($target))" end)),
                suffix: ($df + (if $target == "" then "" else "-\($target)" end) | gsub("[/.]"; "-"))
              }
            )' <<<"${list}")

          # 3. マニフェストの記載ミスは、ビルドを待たずにここで落とす
          while IFS= read -r f; do
            if [ -z "${f}" ] || [ ! -f "${f}" ]; then
              echo "::error::${manifest} の images[].dockerfile が未指定か、ファイルが存在しません: '${f}'"
              exit 1
            fi
          done < <(jq --raw-output '.[].dockerfile' <<<"${images}")

          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "スキャン対象: ${images}"

  scan-fs:
    name: "依存パッケージ / IaC をスキャン"
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Trivy DB のダウンロード遅延でハングするのを防ぐ
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "インライン ignore コメントの禁止"
        # Trivy にはインライン ignore を無効化するオプションが無いため、コメント自体を禁止する。
        # tfsec 互換の接頭辞も Trivy は ignore として扱うので両方を対象にする。
        # トークンを分割しているのは、このファイル自身が検知されるのを防ぐため
        shell: bash
        run: |
          set -euo pipefail
          TOKEN='(trivy|tfsec):''ignore'
          if git grep -InE "${TOKEN}" -- .; then
            echo "::error::インライン ignore コメント（trivy / tfsec の ignore トークン）は使用できません。.trivyignore / .trivyignore.yaml で抑制してください（変更にはセキュリティチームの承認が必要）"
            exit 1
          fi

      - name: "Trivy fs スキャン"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        # env と検知ポリシーはアンカー（&trivy-*）で定義し、scan-image から同じ値を参照する
        env: &trivy-db-env
          # 必須ワークフローがレジストリのレート制限で落ちないよう、公式配布先 3 箇所をフォールバック指定する
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          scan-type: fs
          scan-ref: .
          scanners: &trivy-scanners vuln,misconfig
          severity: ${{ needs.detect.outputs.severity }}
          ignore-unfixed: &trivy-ignore-unfixed true  # 修正版が無い脆弱性は除外する
          exit-code: &trivy-exit-code 1
          trivyignores: ${{ needs.detect.outputs.trivyignores }}
          # GHAS が無く SARIF を使えないため JSON で出力し、次の step で表示する
          format: json
          output: trivy-fs.json

      - name: "スキャン結果を log と annotation に表示"
        # Trivy が検知して失敗しても結果は表示する
        if: ${{ !cancelled() && hashFiles('trivy-fs.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          trivy convert --format table --output trivy-fs.txt trivy-fs.json
          cat trivy-fs.txt

          # 検出箇所を PR に annotation で表示する（vuln は行番号を持たないのでファイル単位）。
          # パッケージ名やパスは PR 側で自由に書けるため、workflow command としてエスケープする
          jq -r '
            def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def esc_prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
            .Results[]? | (.Target | esc_prop) as $file |
            ((.Vulnerabilities // [])[]
              | "::error file=\($file)::" + ("trivy (\(.VulnerabilityID)): \(.PkgName)@\(.InstalledVersion) — \(.Title // .VulnerabilityID)" | esc)),
            ((.Misconfigurations // [])[]
              | "::error file=\($file),line=\(.CauseMetadata.StartLine // 1)::" + ("trivy (\(.AVDID // .ID)): \(.Title)" | esc))
          ' trivy-fs.json

      - name: "スキャン結果を artifact に保存"
        # log の保持期間が切れても後から調べられるようにする
        if: ${{ !cancelled() && hashFiles('trivy-fs.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: trivy-fs
          path: |
            trivy-fs.txt
            trivy-fs.json
          retention-days: 30

  scan-image:
    name: "イメージをスキャン (${{ matrix.label }})"
    needs: detect
    # 空の matrix は job エラーになるため、対象 0 件なら skip する（skip は run の成功として扱われる）
    if: needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # docker build を含むため fs スキャンより長めに取る
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.images) }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Buildx をセットアップ"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: "イメージをビルド"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}          # 空なら無視される
          build-args: ${{ matrix.build_args }}  # 空なら無視される
          push: false
          load: true  # スキャンできるよう docker daemon に読み込む
          tags: localbuild/trivy-scan:latest
          provenance: false  # attestation 付きのイメージは load できないため無効化
          # 同じ PR 内の再ビルドを速くする。main では run しないため cache は他の PR と共有されない。
          # repo の cache 枠を圧迫しないよう、中間ステージまで保存する mode=max は使わない
          cache-from: type=gha,scope=trivy-image-${{ matrix.suffix }}
          cache-to: type=gha,mode=min,scope=trivy-image-${{ matrix.suffix }}

      - name: "Trivy image スキャン"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env: *trivy-db-env
        with:
          scan-type: image
          image-ref: localbuild/trivy-scan:latest
          scanners: *trivy-scanners
          severity: ${{ needs.detect.outputs.severity }}
          ignore-unfixed: *trivy-ignore-unfixed
          exit-code: *trivy-exit-code
          trivyignores: ${{ needs.detect.outputs.trivyignores }}
          format: json
          output: trivy-image.json

      - name: "スキャン結果を log と annotation に表示"
        # Trivy が検知して失敗しても結果は表示する
        if: ${{ !cancelled() && hashFiles('trivy-image.json') != '' }}
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          trivy convert --format table --output trivy-image.txt trivy-image.json
          cat trivy-image.txt

          # イメージ内の検出は repo のファイルに対応しないため、ビルド元の Dockerfile に annotation を付ける。
          # パッケージ名やパスは PR 側で自由に書けるため、workflow command としてエスケープする
          jq -r --arg dockerfile "${DOCKERFILE}" '
            def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def esc_prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
            ($dockerfile | esc_prop) as $file |
            .Results[]? |
            ((.Vulnerabilities // [])[]
              | "::error file=\($file)::" + ("trivy (\(.VulnerabilityID)): \(.PkgName)@\(.InstalledVersion) — \(.Title // .VulnerabilityID)" | esc)),
            ((.Misconfigurations // [])[]
              | "::error file=\($file)::" + ("trivy (\(.AVDID // .ID)): \(.Title)" | esc))
          ' trivy-image.json

      - name: "スキャン結果を artifact に保存"
        # log の保持期間が切れても後から調べられるようにする
        if: ${{ !cancelled() && hashFiles('trivy-image.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: trivy-image-${{ matrix.suffix }}
          path: |
            trivy-image.txt
            trivy-image.json
          retention-days: 30
