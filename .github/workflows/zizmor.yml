name: "🛡️ zizmor"

# GitHub Actions のワークフロー / action 定義を zizmor で静的解析し、severity HIGH 以上の検出でマージをブロックする。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「Actions 関連ファイルが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では scan を skip し、run 全体は success になる
#    （ルールセットが ~ALL 適用のため、対象外の PR でも合格できる必要がある）。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: zizmor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: "GitHub Actions 設定をスキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "スキャン対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          list-files: json
          # 削除ファイルはスキャンできないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            config:
              - added|modified|copied: ".github/zizmor.yml"
            targets:
              - added|modified|copied: ".github/workflows/*.yml"
              - added|modified|copied: ".github/workflows/*.yaml"
              - added|modified|copied: "action.yml"
              - added|modified|copied: "action.yaml"
              - added|modified|copied: "**/action.yml"
              - added|modified|copied: "**/action.yaml"

      - name: "Checkout"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "インライン ignore コメントの禁止"
        # zizmor の --no-ignores は承認必須の .github/zizmor.yml による抑制まで無効化してしまうため、
        # インラインコメントのトークンの存在自体を禁止する（抑制は .github/zizmor.yml に限定する）。
        # 検査対象は zizmor がスキャンし得る Actions 関連ファイルのみ（ドキュメント等の誤検知を避ける）
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git grep -InE 'zizmor:[[:space:]]*ignore' -- \
            ':(glob).github/workflows/*.yml' ':(glob).github/workflows/*.yaml' \
            ':(glob)**/action.yml' ':(glob)**/action.yaml'; then
            echo "::error::インラインの ignore コメントは使用できません。.github/zizmor.yml で抑制してください（変更にはセキュリティチームの承認が必要）"
            exit 1
          fi

      - name: "App 認証情報の有無を判定"
        # 必須ワークフローは対象リポジトリの文脈で動くため、org の変数 / シークレットは対象リポジトリ側で解決される。
        # fork / Dependabot の PR ではシークレットが渡されないため、有無を見てトークン発行を skip する
        # （secrets コンテキストは step の if で参照できないため、step の env 経由で真偽値にする）
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        id: app
        shell: bash
        env:
          HAS_APP: ${{ vars.ZIZMOR_APP_CLIENT_ID != '' && secrets.ZIZMOR_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          echo "available=${HAS_APP}" >> "$GITHUB_OUTPUT"

      - name: "github-workflows 参照用トークンを発行"
        # 対象リポジトリの github.token は自リポジトリにしか届かず、private な本リポジトリのタグ / ブランチ一覧を取得できない。
        # zizmor の impostor-commit 監査は参照先の一覧取得に失敗すると fatal で終了する
        # （findings ではなく監査内部の例外のため .github/zizmor.yml の ignore では抑制できない: #21）。
        # 本リポジトリのみ・contents: read に限定した installation token を発行して GH_TOKEN に渡す。
        # 発行に失敗（鍵ローテーション漏れ・App のアンインストール・Client ID 誤りなど）しても job は止めず
        # github.token にフォールバックする。必須チェックのため、ここで失敗させると org 全体のワークフロー変更 PR が止まる
        if: steps.app.outputs.available == 'true'
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.ZIZMOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.ZIZMOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: github-workflows
          permission-contents: read

      - name: "Install zizmor"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        shell: bash
        env:
          # renovate: datasource=github-release-attachments depName=zizmorcore/zizmor
          VERSION: v1.30.1
          SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          set -euo pipefail
          ARCHIVE="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/zizmorcore/zizmor/releases/download/${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo tar -xz -C /usr/local/bin -f "$ARCHIVE" zizmor
          rm -f "$ARCHIVE"
          zizmor --version

      - name: "zizmor スキャン"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        shell: bash
        env:
          # GH_TOKEN があると online audit（impostor-commit / known-vulnerable-actions 等）も有効になる。
          # App トークンが無い（資格情報未登録・fork / Dependabot の PR）か発行に失敗した場合は github.token にフォールバックする
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # success / failure / skipped（資格情報なし）
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          # 設定ファイルは全ファイルの検出結果に影響するため、変更時は repo 全体をスキャン
          SCAN_ALL: ${{ steps.filter.outputs.config }}
          TARGETS: ${{ steps.filter.outputs.targets_files }}
        run: |
          set -euo pipefail
          case "${APP_TOKEN_OUTCOME}" in
            success) ;;
            failure) reason="App トークンの発行に失敗したため" ;;
            *) reason="App の資格情報（ZIZMOR_APP_CLIENT_ID / ZIZMOR_APP_PRIVATE_KEY）を参照できないため" ;;
          esac
          if [ "${APP_TOKEN_OUTCOME}" != "success" ]; then
            echo "::warning::${reason} github.token で実行します。private リポジトリ（github-workflows 等）を参照するワークフローがあると impostor-commit 監査が fatal になります（docs/SETUP.md 3. を参照）"
          fi

          # 設定ファイルの自動探索はリポジトリ直下や入力ファイルの祖先ディレクトリの zizmor.yml / zizmor.yaml
          # にも及び、承認必須（2.5）の対象外パスから検出を抑制できてしまうため、
          # 承認必須の .github/zizmor.yml に固定する（未作成なら設定なしで実行する）
          config_args=(--no-config)
          if [ -f .github/zizmor.yml ]; then
            config_args=(--config .github/zizmor.yml)
          fi

          # --format github: 検出箇所を PR に annotation 表示する
          if [ "${SCAN_ALL}" = "true" ]; then
            zizmor --no-progress --format github --min-severity high "${config_args[@]}" .
            exit 0
          fi

          targets=()
          while IFS= read -r t; do
            if [ -n "${t}" ]; then targets+=("${t}"); fi
          done < <(jq -r '.[]' <<< "${TARGETS}")
          zizmor --no-progress --format github --min-severity high "${config_args[@]}" "${targets[@]}"
