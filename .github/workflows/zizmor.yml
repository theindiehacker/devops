name: "🛡️ zizmor"

# GitHub Actions のワークフロー / action 定義（と zizmor が収集する dependabot.yml / pre-commit 設定）を zizmor で静的解析し、
# severity HIGH 以上の検出でマージをブロックする。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「Actions 関連ファイルが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では scan を skip し、run 全体は success になる
#    （ルールセットが ~ALL 適用のため、対象外の PR でも合格できる必要がある）。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: zizmor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: "GitHub Actions 設定をスキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "スキャン対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          list-files: json
          # 削除ファイルはスキャンできないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            config:
              - added|modified|copied: ".github/zizmor.yml"
            targets:
              - added|modified|copied: ".github/workflows/*.yml"
              - added|modified|copied: ".github/workflows/*.yaml"
              - added|modified|copied: "action.yml"
              - added|modified|copied: "action.yaml"
              - added|modified|copied: "**/action.yml"
              - added|modified|copied: "**/action.yaml"
              - added|modified|copied: ".github/dependabot.yml"
              - added|modified|copied: ".github/dependabot.yaml"
              - added|modified|copied: ".pre-commit-config.yaml"
              - added|modified|copied: ".pre-commit-config.yml"
              - added|modified|copied: ".pre-commit-hooks.yaml"
              - added|modified|copied: ".pre-commit-hooks.yml"

      - name: "Checkout"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "インライン ignore コメントの禁止"
        # zizmor の --no-ignores は承認必須の .github/zizmor.yml による抑制まで無効化してしまうため、
        # インラインコメントのトークンの存在自体を禁止する（抑制は .github/zizmor.yml に限定する）。
        # 検査対象は zizmor がスキャンし得る Actions 関連ファイルのみ（ドキュメント等の誤検知を避ける）
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git grep -InE 'zizmor:[[:space:]]*ignore' -- \
            ':(glob).github/workflows/*.yml' ':(glob).github/workflows/*.yaml' \
            ':(glob)**/action.yml' ':(glob)**/action.yaml'; then
            echo "::error::インラインの ignore コメントは使用できません。.github/zizmor.yml で抑制してください（変更にはセキュリティチームの承認が必要）"
            exit 1
          fi

      - name: "Install zizmor"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        shell: bash
        env:
          # renovate: datasource=github-release-attachments depName=zizmorcore/zizmor
          VERSION: v1.30.1
          SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          set -euo pipefail
          ARCHIVE="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/zizmorcore/zizmor/releases/download/${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo tar -xz -C /usr/local/bin -f "$ARCHIVE" zizmor
          rm -f "$ARCHIVE"
          zizmor --version

      - name: "zizmor スキャン"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        shell: bash
        env:
          # GH_TOKEN があると online audit（impostor-commit / known-vulnerable-actions 等）も有効になる
          GH_TOKEN: ${{ github.token }}
          # 設定ファイルは全ファイルの検出結果に影響するため、変更時は repo 全体をスキャン
          SCAN_ALL: ${{ steps.filter.outputs.config }}
          TARGETS: ${{ steps.filter.outputs.targets_files }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # 設定ファイルの自動探索はリポジトリ直下や入力ファイルの祖先ディレクトリの zizmor.yml / zizmor.yaml
          # にも及び、承認必須（2.5）の対象外パスから検出を抑制できてしまうため、
          # 承認必須の .github/zizmor.yml に固定する（未作成なら設定なしで実行する）
          config_args=(--no-config)
          if [ -f .github/zizmor.yml ]; then
            config_args=(--config .github/zizmor.yml)
          fi

          if [ "${SCAN_ALL}" = "true" ]; then
            # `zizmor .` が収集する種類（workflow / action / dependabot / pre-commit）を tracked ファイルから列挙する
            mapfile -t targets < <(git ls-files -- \
              ':(glob).github/workflows/*.yml' ':(glob).github/workflows/*.yaml' ':(glob)**/action.yml' ':(glob)**/action.yaml' \
              ':(glob).github/dependabot.yml' ':(glob).github/dependabot.yaml' \
              ':(glob).pre-commit-config.yaml' ':(glob).pre-commit-config.yml' ':(glob).pre-commit-hooks.yaml' ':(glob).pre-commit-hooks.yml')
          else
            mapfile -t targets < <(jq -r '.[]' <<< "${TARGETS}")
          fi

          # 本リポジトリ（<org>/github-workflows）だけを参照するファイル（Claude レビューの caller 等）は online 監査を省く。
          # 本リポジトリが private だと対象リポジトリの github.token では参照先を読めず、impostor-commit が fatal で終了するため（#21）。
          # fork 禁止の private リポジトリには fork 由来の impostor commit が成立せず、ブランチ / タグに属さない SHA の検知は
          # private 化後は github.token ではどのみち監査できないため、この省略で新たに失う検知は無い。
          # 他の action を 1 つでも参照するファイルは従来どおり online で監査するため、免除を抜け道にはできない。
          # TODO: zizmor に特定リポジトリを除外する設定が入ったら .github/zizmor.yml に乗り換える
          #       https://github.com/zizmorcore/zizmor/issues/1350
          online=()
          offline=()
          for t in "${targets[@]}"; do
            # YAML を解析して uses: の値を再帰的に集める（flow 形式・引用符付きキー・アンカーも対象。zizmor と同じ見え方にする）。
            # 解析に失敗したファイルは refs が空になり online 側に倒れる（fatal で気付ける安全側）
            refs=$(yq -r '[explode(.) | .. | select(tag == "!!map" and has("uses")) | .uses] | .[]' "${t}" 2>/dev/null \
              | grep -vE '^(\./|docker://|\$/)' || true)
            # owner / repo 名は大文字小文字を区別しない
            if [ -n "${refs}" ] && ! grep -qivE "^${OWNER}/github-workflows/" <<< "${refs}"; then
              offline+=("${t}")
              echo "::notice file=${t}::${OWNER}/github-workflows のみを参照するため online 監査を省略しました（理由は github-workflows の .github/workflows/zizmor.yml を参照）"
            else
              online+=("${t}")
            fi
          done

          # --format github: 検出箇所を PR に annotation 表示する
          rc=0
          if [ "${#online[@]}" -gt 0 ]; then
            zizmor --no-progress --format github --min-severity high "${config_args[@]}" "${online[@]}" || rc=1
          fi
          if [ "${#offline[@]}" -gt 0 ]; then
            zizmor --no-progress --no-online-audits --format github --min-severity high "${config_args[@]}" "${offline[@]}" || rc=1
          fi
          exit "${rc}"
