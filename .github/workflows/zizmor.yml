name: "🛡️ zizmor"

# GitHub Actions のワークフロー / action 定義（と zizmor が収集する dependabot.yml / pre-commit 設定）を zizmor で静的解析し、
# severity HIGH 以上の検出でマージをブロックする。検査の中身は devops の Taskfile.yml の security:check:zizmor。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「Actions 関連ファイルが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では scan を skip し、run 全体は success になる
#    （ルールセットが ~ALL 適用のため、対象外の PR でも合格できる必要がある）。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: zizmor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: "GitHub Actions 設定をスキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "スキャン対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          list-files: json
          # 削除ファイルはスキャンできないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            config:
              - added|modified|copied: ".github/zizmor.yml"
            targets:
              - added|modified|copied: ".github/workflows/*.yml"
              - added|modified|copied: ".github/workflows/*.yaml"
              - added|modified|copied: "action.yml"
              - added|modified|copied: "action.yaml"
              - added|modified|copied: "**/action.yml"
              - added|modified|copied: "**/action.yaml"
              # zizmor はファイル名だけで判定し任意のディレクトリから収集するため、直下に限定しない
              - added|modified|copied: "**/dependabot.yml"
              - added|modified|copied: "**/dependabot.yaml"
              - added|modified|copied: "**/.pre-commit-config.yaml"
              - added|modified|copied: "**/.pre-commit-config.yml"
              - added|modified|copied: "**/.pre-commit-hooks.yaml"
              - added|modified|copied: "**/.pre-commit-hooks.yml"

      - name: "Checkout"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 設定ファイルは全ファイルの検出結果に影響するため、変更時は repo 全体をスキャンする（FILES を空にする）
      - name: "zizmor スキャン"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.targets == 'true'
        uses: theindiehacker/devops/.github/actions/task@main
        env:
          FILES: ${{ steps.filter.outputs.config != 'true' && steps.filter.outputs.targets_files || '' }}
          # GH_TOKEN があると online audit（impostor-commit / known-vulnerable-actions 等）も有効になる
          GH_TOKEN: ${{ github.token }}
        with:
          task: security:check:zizmor
