name: "🧠 Claude"

# 本リポジトリ自身から Claude ワークフローを呼び出す caller (他リポジトリの caller と同じ経路で検証するため)
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# write は呼び出し先の job に渡す分だけを job 側で与える
permissions: {}

jobs:
  code-review:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/code-review')
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/claude-code-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  security-review:
    if: github.event_name == 'issue_comment' && github.event.comment.body == '/security-review'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/claude-security-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/claude.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # TODO: 調査用。マージ前に削除する
  debug:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_MENTION: ${{ contains(github.event.comment.body, '@claude') }}
          USER_TYPE: ${{ github.event.comment.user.type }}
          ASSOC: ${{ github.event.comment.author_association }}
          PR_STATE: ${{ github.event.pull_request.state }}
          CLAUSE: ${{ github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && github.event.pull_request.state == 'open' }}
        run: env | grep -E '^(EVENT_NAME|HAS_MENTION|USER_TYPE|ASSOC|PR_STATE|CLAUSE)='
