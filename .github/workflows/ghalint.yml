name: "🛡️ ghalint"

# permissions 未設定・アクションの SHA 未固定など、構文ではなくセキュリティ観点のポリシー違反を検出する。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「ワークフロー / 設定ファイルが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では lint を skip し、run 全体は success になる
#    （ルールセットが All repositories 適用のため、対象外の PR でも合格できる必要がある）。
#    なお ghalint run は個別ファイル指定ができないため、実行時は .github/workflows/ 全体が対象になる。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: ghalint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: "workflow セキュリティポリシーチェック"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "lint 実行要否を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # 削除のみの変更は残りのファイルの lint 結果を変えないため対象外（rename は added + deleted に分解され新パス側が対象になる）。
          # 設定ファイルはポリシーの除外設定に影響するため対象（ghalint の自動探索パス ^(\.|\.github/)?ghalint\.ya?ml$ をすべて列挙）
          filters: |
            workflows:
              - added|modified|copied: ".github/workflows/*.yml"
              - added|modified|copied: ".github/workflows/*.yaml"
              - added|modified|copied: "ghalint.yml"
              - added|modified|copied: "ghalint.yaml"
              - added|modified|copied: ".ghalint.yml"
              - added|modified|copied: ".ghalint.yaml"
              - added|modified|copied: ".github/ghalint.yml"
              - added|modified|copied: ".github/ghalint.yaml"

      - name: "Checkout"
        if: steps.filter.outputs.workflows == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install ghalint"
        if: steps.filter.outputs.workflows == 'true'
        shell: bash
        env:
          # renovate: datasource=github-release-attachments depName=suzuki-shunsuke/ghalint
          VERSION: v1.5.6
          SHA256: 98ee0e3330de7286f470d1e89c03ff7ce70d7a5998ba0f15969c400447be579c
        run: |
          set -euo pipefail
          ARCHIVE="ghalint_${VERSION#v}_linux_amd64.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/suzuki-shunsuke/ghalint/releases/download/${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo tar -xz -C /usr/local/bin -f "$ARCHIVE" ghalint
          rm -f "$ARCHIVE"
          ghalint version

      - name: "ghalint"
        if: steps.filter.outputs.workflows == 'true'
        shell: bash
        env:
          GHALINT_LOG_COLOR: never  # annotation 生成のログ解析を色コードで壊さない
        run: |
          set -euo pipefail
          rc=0
          ghalint run 2>ghalint.log || rc=$?
          cat ghalint.log

          # ghalint は行番号を出力しないため、違反はワークフローファイル単位で PR に annotation 表示する
          if [ "${rc}" -ne 0 ] && [ -s ghalint.log ]; then
            grep ' ERR ' ghalint.log | while IFS= read -r line; do
              file=$(sed -n 's/.* workflow_file_path=\([^ ]*\).*/\1/p' <<< "${line}")
              policy=$(sed -n 's/.* policy_name=\([^ ]*\).*/\1/p' <<< "${line}")
              error=$(sed -n 's/.* error="\([^"]*\)".*/\1/p' <<< "${line}")
              if [ -n "${file}" ]; then
                echo "::error file=${file}::ghalint (${policy}): ${error}"
              fi
            done
          fi
          exit "${rc}"
