name: "🏗️ tflint"

# Terraform の定義ファイルを tflint で lint する。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「Terraform 関連ファイルが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では lint を skip し、run 全体は success になる
#    （ルールセットが All repositories 適用のため、Terraform 未使用の repo でも合格できる必要がある）。
#
# 設定は全リポジトリ共通で本ワークフローに埋め込み TFLINT_CONFIG_FILE で固定する（対象 repo の .tflint.hcl は読まない）。
# インラインの tflint-ignore コメントによる抑制も禁止する。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: tflint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Terraform を lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "lint 対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          list-files: json
          # 削除ファイルは lint できないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            terraform:
              - added|modified|copied: "**/*.tf"
              - added|modified|copied: "**/*.tf.json"
              - added|modified|copied: "**/*.tfvars"
              - added|modified|copied: "**/*.tfvars.json"

      - name: "Checkout"
        if: steps.filter.outputs.terraform == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "インライン ignore コメントの禁止"
        if: steps.filter.outputs.terraform == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIF 'tflint-ignore' -- '*.tf' ':(exclude,glob)**/.terraform/**'; then
            echo "::error::tflint-ignore コメントは使用できません（ルールは github-workflows の .github/workflows/tflint.yml で全リポジトリ共通に固定しています）"
            exit 1
          fi

      # checksums は release の zip の SHA-256。action がダウンロード後に検証する
      - name: "Setup tflint"
        if: steps.filter.outputs.terraform == 'true'
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          # renovate: datasource=github-release-attachments depName=terraform-linters/tflint
          tflint_version: v0.64.0
          checksums: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537

      # 以降の tflint はすべてこの設定と plugin を使う（対象 repo の .tflint.hcl や、
      # cwd の ./.tflint.d/plugins が優先されて設定・plugin を差し替えられないよう固定する）
      - name: "tflint の設定と plugin の配置先を固定"
        if: steps.filter.outputs.terraform == 'true'
        shell: bash
        env:
          TFLINT_HCL: |
            config {
              call_module_type = "local"
            }

            plugin "terraform" {
              enabled = true
              preset  = "all"
            }

            plugin "google" {
              enabled = true
              version = "0.40.0"
              source  = "github.com/terraform-linters/tflint-ruleset-google"
            }

            plugin "aws" {
              enabled = true
              version = "0.49.0"
              source  = "github.com/terraform-linters/tflint-ruleset-aws"
            }
        run: |
          set -euo pipefail
          printf '%s' "${TFLINT_HCL}" > "${RUNNER_TEMP}/.tflint.hcl"
          echo "TFLINT_CONFIG_FILE=${RUNNER_TEMP}/.tflint.hcl" >> "${GITHUB_ENV}"
          echo "TFLINT_PLUGIN_DIR=${RUNNER_TEMP}/tflint-plugins" >> "${GITHUB_ENV}"

      - name: "tflint plugin の導入"
        if: steps.filter.outputs.terraform == 'true'
        shell: bash
        env:
          # tflint --init が GitHub Releases から plugin を取得する際の rate limit 対策
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      # lint はディレクトリ（モジュール）単位のため、変更ファイルをディレクトリに集約する。
      # .terraform はキャッシュ・vendored モジュール置き場のため lint 対象外
      - name: "lint 対象ディレクトリを列挙"
        if: steps.filter.outputs.terraform == 'true'
        shell: bash
        env:
          TARGETS: ${{ steps.filter.outputs.terraform_files }}
        run: |
          set -euo pipefail
          jq -r '.[] | select(test("(^|/)\\.terraform/") | not) | if contains("/") then sub("/[^/]*$"; "") else "." end' \
            <<< "${TARGETS}" | sort -u > "${RUNNER_TEMP}/tflint-dirs.txt"

      # 対象 repo 由来のパスで ::group:: の行を分けられないようエスケープする。
      # 結果は annotation にせず log に出す（既定の形式で、ファイル・行・ルール名と該当箇所が出る）
      - name: "tflint"
        if: steps.filter.outputs.terraform == 'true'
        shell: bash
        run: |
          set -euo pipefail
          escape() { local value=${1//%/%25}; value=${value//$'\r'/%0D}; printf '%s' "${value//$'\n'/%0A}"; }
          status=0
          while IFS= read -r dir; do
            echo "::group::$(escape "${dir}")"
            tflint --chdir="${dir}" || status=1
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/tflint-dirs.txt"
          exit "${status}"
