name: "🏗️ tflint"

# Terraform の定義ファイルを tflint で lint する。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「Terraform 関連ファイルが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では lint を skip し、run 全体は success になる
#    （ルールセットが All repositories 適用のため、Terraform 未使用の repo でも合格できる必要がある）。
#
# 設定ファイル（.tflint.hcl）は実行ディレクトリから repo ルートへ遡り、最初に見つかったものを適用する
# （tflint が自動で読むのは --chdir 先のものだけなので、それ以外は --config で明示する）。
# どちらも無ければ組み込み terraform ruleset の recommended プリセットで lint される。
# plugin（provider ruleset 等）は .tflint.hcl で宣言すれば実行前の tflint --init で導入される。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: tflint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Terraform を lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "lint 対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          list-files: json
          # 削除ファイルは lint できないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            config:
              - added|modified|copied: ".tflint.hcl"
              - added|modified|copied: "**/.tflint.hcl"
            terraform:
              - added|modified|copied: "**/*.tf"
              - added|modified|copied: "**/*.tf.json"
              - added|modified|copied: "**/*.tfvars"
              - added|modified|copied: "**/*.tfvars.json"

      - name: "Checkout"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.terraform == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # checksums は release の zip の SHA-256。action がダウンロード後に検証する
      - name: "Setup tflint"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.terraform == 'true'
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          # renovate: datasource=github-release-attachments depName=terraform-linters/tflint
          tflint_version: v0.64.0
          checksums: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537

      - name: "tflint"
        if: steps.filter.outputs.config == 'true' || steps.filter.outputs.terraform == 'true'
        shell: bash
        env:
          # plugin を使う repo の tflint --init が GitHub Releases から取得する際の rate limit 対策
          GITHUB_TOKEN: ${{ github.token }}
          # 設定ファイルは全ディレクトリの検出結果に影響するため、変更時は全ディレクトリを lint
          SCAN_ALL: ${{ steps.filter.outputs.config }}
          TARGETS: ${{ steps.filter.outputs.terraform_files }}
        run: |
          set -euo pipefail
          # 対象 repo 由来のパスで ::group:: の行を分けられないようエスケープする
          escape() { local value=${1//%/%25}; value=${value//$'\r'/%0D}; printf '%s' "${value//$'\n'/%0A}"; }

          # lint はディレクトリ（モジュール）単位のため、変更ファイルをディレクトリに集約する。
          # .terraform はキャッシュ・vendored モジュール置き場のため lint 対象外
          if [ "${SCAN_ALL}" = "true" ]; then
            dirs=$(
              find . \( -path ./.git -o -name .terraform \) -prune -o \
                -type f \( -name '*.tf' -o -name '*.tf.json' \) -print \
              | sed 's|^\./||' \
              | while IFS= read -r f; do dirname "${f}"; done | sort -u
            )
          else
            dirs=$(
              jq -r '.[]' <<< "${TARGETS}" | { grep -Ev '(^|/)\.terraform/' || true; } \
              | while IFS= read -r f; do dirname "${f}"; done | sort -u
            )
          fi

          status=0
          while IFS= read -r dir; do
            if [ -z "${dir}" ]; then continue; fi
            echo "::group::$(escape "${dir}")"

            # 設定は実行ディレクトリから repo ルートへ遡って最初に見つかったものを使う。
            # tflint が自動で読むのは --chdir 先の .tflint.hcl だけで、terraform/.tflint.hcl のように
            # 中間ディレクトリへ置いた設定は明示しないと無視され、そこで宣言した plugin
            # （provider ruleset）のルールが 1 つも効かないまま success になってしまう
            args=()
            probe="${dir}"
            while :; do
              if [ -f "${probe}/.tflint.hcl" ]; then
                # 実行ディレクトリ自身のものは tflint が自動で読むため --config は付けない
                if [ "${probe}" != "${dir}" ]; then args=(--config="${PWD}/${probe}/.tflint.hcl"); fi
                break
              fi
              if [ "${probe}" = "." ]; then break; fi
              probe=$(dirname "${probe}")
            done

            tflint --chdir="${dir}" "${args[@]}" --init
            # 結果は annotation にせず log に出す（既定の形式で、ファイル・行・ルール名と該当箇所が出る）
            tflint --chdir="${dir}" "${args[@]}" || status=1
            echo "::endgroup::"
          done <<< "${dirs}"
          exit "${status}"
