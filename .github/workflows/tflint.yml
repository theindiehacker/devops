name: "🏗️ tflint"

# Terraform の定義ファイルを tflint で lint する。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「Terraform 関連ファイルが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では lint を skip し、run 全体は success になる
#    （ルールセットが All repositories 適用のため、Terraform 未使用の repo でも合格できる必要がある）。
#
# 検査の中身（全リポジトリ共通の設定・tflint-ignore コメントの禁止）は devops の Taskfile.yml の style:check:tflint。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: tflint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Terraform を lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "lint 対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          list-files: json
          # 削除ファイルは lint できないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            terraform:
              - added|modified|copied: "**/*.tf"
              - added|modified|copied: "**/*.tf.json"
              - added|modified|copied: "**/*.tfvars"
              - added|modified|copied: "**/*.tfvars.json"

      - name: "Checkout"
        if: steps.filter.outputs.terraform == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "tflint"
        if: steps.filter.outputs.terraform == 'true'
        uses: theindiehacker/devops/.github/actions/task@main
        env:
          FILES: ${{ steps.filter.outputs.terraform_files }}
          # tflint --init が GitHub Releases から plugin を取得する際の rate limit 対策（init の後は unset する）
          GH_TOKEN: ${{ github.token }}
        with:
          task: style:check:tflint
