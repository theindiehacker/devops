name: "🏗️ terraform fmt"

# Terraform の書式を terraform fmt で検査する（init が要る validate / test は含めない）。
# 検査の中身は devops の Taskfile.yml の style:check:terraform:fmt。
on:
  # 必須ワークフローは on: のフィルタが無視され全 PR で起動するため、対象の判定は job 内で行う
  # （All repositories 適用のため、対象の変更が無い PR では skip し run は success にする）
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: terraform-fmt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fmt:
    name: "Terraform の書式を検査"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "検査対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          list-files: json
          # 対象は terraform fmt が整形する HCL のみ（*.tf.json / *.tfvars.json は対象外）。
          # 削除ファイルは検査できないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            terraform:
              - added|modified|copied: "**/*.tf"
              - added|modified|copied: "**/*.tfvars"
              - added|modified|copied: "**/*.tftest.hcl"

      - name: "Checkout"
        if: steps.filter.outputs.terraform == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # repo 全体を検査すると、その PR が触っていないディレクトリに元からある崩れでも fail するため、変更したディレクトリだけを検査する
      - name: "terraform fmt"
        if: steps.filter.outputs.terraform == 'true'
        uses: theindiehacker/devops/.github/actions/task@main
        env:
          FILES: ${{ steps.filter.outputs.terraform_files }}
        with:
          task: style:check:terraform:fmt
