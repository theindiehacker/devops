name: "🏗️ terraform fmt"

# Terraform の書式を terraform fmt で検査する（init が要る validate / test は含めない）。
on:
  # 必須ワークフローは on: のフィルタが無視され全 PR で起動するため、対象の判定は job 内で行う
  # （All repositories 適用のため、対象の変更が無い PR では skip し run は success にする）
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: terraform-fmt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fmt:
    name: "Terraform の書式を検査"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "検査対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          list-files: json
          # 対象は terraform fmt が整形する HCL のみ（*.tf.json / *.tfvars.json は対象外）。
          # 削除ファイルは検査できないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            terraform:
              - added|modified|copied: "**/*.tf"
              - added|modified|copied: "**/*.tfvars"
              - added|modified|copied: "**/*.tftest.hcl"

      - name: "Checkout"
        if: steps.filter.outputs.terraform == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install terraform"
        if: steps.filter.outputs.terraform == 'true'
        shell: bash
        env:
          # 書式のルールは版によってほぼ変わらないため、対象 repo の版を読み取らず中央で 1 つに固定する
          # （版を repo 側の宣言に従わせると、PR が指定した任意の版をダウンロードすることになり
          #   下の SHA-256 検証が成立しなくなる）
          VERSION: 1.16.0
          # terraform_1.16.0_linux_amd64.zip の SHA256（公式 SHA256SUMS から確定）
          SHA256: 41d05b927aa174f15d1228c4eba832a323b716c68b415ef5a00179f46cc602d3
        run: |
          set -euo pipefail
          ARCHIVE="terraform_${VERSION}_linux_amd64.zip"
          curl -sSfL -o "$ARCHIVE" "https://releases.hashicorp.com/terraform/${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo unzip -o "$ARCHIVE" terraform -d /usr/local/bin
          sudo chmod +x /usr/local/bin/terraform
          rm -f "$ARCHIVE"
          terraform version

      - name: "terraform fmt"
        if: steps.filter.outputs.terraform == 'true'
        shell: bash
        env:
          TARGETS: ${{ steps.filter.outputs.terraform_files }}
        run: |
          set -euo pipefail
          # 対象 repo 由来のパスで ::group:: の行を分けられないようエスケープする
          escape() { local value=${1//%/%25}; value=${value//$'\r'/%0D}; printf '%s' "${value//$'\n'/%0A}"; }

          # fmt は -recursive を付けなければ指定ディレクトリ直下だけを見るため、変更ファイルを
          # ディレクトリに集約する。repo 全体を -recursive で検査すると、その PR が触っていない
          # ディレクトリに元からある崩れでも fail してしまう。
          # .terraform はキャッシュ・vendored モジュール置き場のため検査対象外
          dirs=$(
            jq -r '.[]' <<< "${TARGETS}" | { grep -Ev '(^|/)\.terraform/' || true; } \
            | while IFS= read -r f; do dirname "${f}"; done | sort -u
          )

          status=0
          while IFS= read -r dir; do
            if [ -z "${dir}" ]; then continue; fi
            echo "::group::$(escape "${dir}")"
            # 結果は annotation にせず log に出す（書式が一致しないファイルと差分を出し、どう直すかを読めるようにする）
            terraform fmt -check -no-color -diff "${dir}" || status=1
            echo "::endgroup::"
          done <<< "${dirs}"
          exit "${status}"
