name: "🛡️ Semgrep"

# アプリケーションコードを Semgrep CE（SAST, ルールセット p/default・severity ERROR のみ）で全 PR スキャンする。
# --baseline-commit により「PR で新規に増えた検出」のみを対象とするため、
# 既存コードの検出が無関係な PR をブロックすることはない。
# 誤検知は承認必須の .semgrepignore で抑制する（インライン nosemgrep は無効化している）。
# 検査の中身は devops の Taskfile.yml の security:check:semgrep。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: semgrep-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: "アプリケーションコードをスキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # --baseline-commit が base コミットを参照するため全履歴が必要
          persist-credentials: false

      - name: "Semgrep スキャン"
        uses: theindiehacker/devops/.github/actions/task@main
        env:
          BASELINE: ${{ github.event.pull_request.base.sha }}
        with:
          task: security:check:semgrep
