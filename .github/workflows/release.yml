name: "🏷️ Release"

# reusable workflow を参照するためのリリースタグ (vX.Y.Z) と GitHub Release を、main の先頭に作る。
# 上げるバージョン (major / minor / patch) を選んで手動実行する。付け方は docs/SETUP.md の「5.」を参照。
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "上げるバージョン (major: 呼び出し側の変更が必要 / minor: 機能追加・挙動の変更 / patch: 不具合の修正・action の更新)"
        type: choice
        options: [patch, minor, major]
        required: true

permissions: {}

# 同時に実行して同じバージョンを取り合わないよう直列化する
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: "リリースタグの作成"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # 実行ブランチは選べるため、main 以外からの実行ではトークンを発行しない
    if: github.ref == 'refs/heads/main'
    steps:
      # タグの作成は tag ruleset で App だけに許しているため、GITHUB_TOKEN ではなく App トークンを使う
      - name: "App トークン発行"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: "タグと GitHub Release を作成"
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          latest=$(gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/v" --jq '.[].ref | sub("^refs/tags/"; "")' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)

          if [ -z "$latest" ]; then
            next=v1.0.0
          else
            if [ "$(gh api "repos/${GH_REPO}/commits/${latest}" --jq .sha)" = "$TARGET_SHA" ]; then
              echo "::error::main の先頭 (${TARGET_SHA}) には ${latest} が付いています。新しい変更をマージしてから実行してください"
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              patch) next="v${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::bump が不正です: ${BUMP}"; exit 1 ;;
            esac
          fi

          echo "${latest:-(なし)} → ${next} (${TARGET_SHA})"
          gh release create "$next" --target "$TARGET_SHA" --title "$next" --generate-notes
          echo "### 🏷️ ${next} を作成しました (\`${TARGET_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"
