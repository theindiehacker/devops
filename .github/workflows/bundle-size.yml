name: "📦 バンドルサイズ"

# フロントエンドのバンドルサイズを計測し、ページ表示速度が遅くなるのを防止する。
# なぜならページ表示速度が遅くなると、UX が悪化するからだ。
#
# PR とマージ先の両方をビルドし、JS・CSS の gzip 後のサイズの増減を PR にコメントする（preactjs/compressed-size-action）。
# 報告だけで、サイズが増えてもマージは止めない。計測できなかった場合は、その旨をコメントし、run は success にする。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    計測対象の判定は本ワークフロー内で行う。
#
# Required workflow は対象 repo から inputs を受け取れないため、計測対象は規約ベースで検出する:
#   - package.json の依存に next / astro を持ち、同じディレクトリに bun.lock / bun.lockb があるディレクトリ
#     （bun.lock が無いと compressed-size-action は npm install を使うため、workspace の子などは計測しない）
#   - PR がそのディレクトリ配下を変更していなければ、2 回のビルドを省くため計測しない
#     （フロントエンドが repo のルートにあると、どのファイルを変えても計測する）
#   - フロントエンドが無い repo では、全ての job を skip し、run 全体は success になる
#
# PR のコードを動かす計測の job（measure）は read のみにし、結果を artifact で渡す。
# PR にコメントする job（comment）だけが pull-requests: write を持ち、PR のコードは動かさない（docs/SETUP.md「2.」）。
# bun 本体は対象 repo の指定ではなく中央で固定し、SHA-256 検証つきで導入する。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

# 同じ PR に新しい push があれば、古い run をキャンセルする。
# concurrency group は repo 内の全 workflow で共有されるため、各 repo の workflow と重ならないよう github-workflows- を付ける
concurrency:
  group: github-workflows-bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: "計測対象を判定"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      frontends: ${{ steps.collect.outputs.frontends }}
      targets: ${{ steps.collect.outputs.targets }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # PR の変更を git diff で調べるため、マージコミットの親（マージ先）も取得する
          fetch-depth: 2

      - name: "計測対象を収集"
        id: collect
        shell: bash
        env:
          # package.json の依存から、計測するファイルを決める（next / astro が無ければ対象外）。
          # ファイル名のハッシュは伏せない。Turbopack のチャンク名はハッシュだけで、Astro（Vite）は同じ名前のチャンクを
          # 複数出すことがあり、伏せると別のファイルが同じ名前になって合計が合わなくなるため
          FRAMEWORKS: |
            (.dependencies + .devDependencies) as $deps
            | if $deps.next then ".next/static/chunks/**/*.{js,css}"
              elif $deps.astro then "dist/**/*.{js,css}"
              else empty end
            | {dir: $dir, pattern: ., changed: $changed}
        # git ls-files はコミットされたファイルだけを返すため、node_modules は対象にならない。
        # JSON として読めない package.json は飛ばす（jq の失敗で detect が失敗し、マージを止めないようにする）。
        # key は artifact の名前に使う通し番号（ディレクトリ名から作ると、別のディレクトリが同じ名前になり得るため）
        run: |
          set -euo pipefail
          all=$(git -c core.quotePath=false ls-files ':(glob)**/package.json' | while IFS= read -r pkg; do
            dir=$(dirname "${pkg}")
            if [ -e "${dir}/bun.lock" ] || [ -e "${dir}/bun.lockb" ]; then
              changed=true; git diff --quiet HEAD^1 HEAD -- "${dir}" && changed=false
              jq -c --arg dir "${dir}" --argjson changed "${changed}" "${FRAMEWORKS}" "${pkg}" || true
            fi
          done | jq -sc 'to_entries | map(.value + {key: "\(.key)"})')
          jq -r '"frontends=\(length > 0)", "targets=\(map(select(.changed)) | tojson)"' <<< "${all}" | tee -a "${GITHUB_OUTPUT}"

  measure:
    name: "バンドルサイズを計測 (${{ matrix.dir }})"
    needs: detect
    # 空の matrix は job エラーになるため、対象 0 件なら skip する（skip は run の成功として扱われる）
    if: needs.detect.outputs.targets != '[]'
    runs-on: ubuntu-latest
    # job の timeout は run を cancelled にしてマージを止めるため、step の timeout の合計より長くし、届かないようにする
    timeout-minutes: 60
    # 報告だけの計測のため、checkout や bun の取得の失敗でもマージを止めない（comment の job が「計測できませんでした」と書く）
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.targets) }}
    steps:
      - name: "Checkout"
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # マージ先のコミット（マージコミットの親）も取得する

      # action はマージ先を git fetch origin <ブランチ>:<ブランチ> で取得し、git reset --hard <ブランチ> で切り替える。
      # public / private を問わず detect と同じマージコミットの親と比べるため、origin を消して fetch を失敗させ
      # （ログの fatal は想定どおり）、ここで作ったブランチでビルドする
      - name: "マージ先のブランチを作る"
        shell: bash
        run: |
          git branch "${GITHUB_BASE_REF}" HEAD^1
          git remote remove origin

      - name: "Install bun"
        shell: bash
        timeout-minutes: 5
        env:
          # renovate: datasource=github-release-attachments depName=oven-sh/bun
          VERSION: bun-v1.4.3
          SHA256: 3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18
        run: |
          set -euo pipefail
          curl -sSfL -o bun.zip "https://github.com/oven-sh/bun/releases/download/${VERSION}/bun-linux-x64.zip"
          echo "${SHA256}  bun.zip" | sha256sum -c -  # SHA-256 検証（改ざん・破損を検知）
          sudo unzip -o -j bun.zip "bun-linux-x64/bun" -d /usr/local/bin
          sudo chmod +x /usr/local/bin/bun
          rm -f bun.zip

      # トークンは read のみのため、action による PR へのコメントは失敗する（ログのエラーは想定どおり）。
      # action はコメントの本文を comment-body に出力するので、それを comment の job に渡す
      - name: "バンドルサイズを比較"
        id: compare
        continue-on-error: true
        # PR とマージ先で 2 回ビルドする（how-much.fun は 5,000 ページ超の静的生成があり、1 回に 9 分かかる）
        timeout-minutes: 40
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9  # 2.10.0
        with:
          cwd: ${{ matrix.dir }}
          pattern: ${{ matrix.pattern }}

      - name: "計測結果をファイルに書く"
        if: steps.compare.outcome == 'success'
        shell: bash
        env:
          BODY: ${{ steps.compare.outputs.comment-body }}
          KEY: ${{ matrix.key }}
        run: printf '%s\n' "${BODY}" > "${RUNNER_TEMP}/bundle-size-${KEY}.md"

      - name: "計測結果を渡す"
        if: steps.compare.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bundle-size-${{ matrix.key }}
          path: ${{ runner.temp }}/bundle-size-${{ matrix.key }}.md
          retention-days: 1

  comment:
    name: "バンドルサイズを PR にコメント"
    needs: [detect, measure]
    # 計測しなかった・計測に失敗した場合も、前回のコメントを書き換えるため動かす（フロントエンドが無い repo では skip）
    if: ${{ !cancelled() && needs.detect.outputs.frontends == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15  # step の timeout の合計より長くする（measure の job と同じ理由）
    # fork からの PR（public repo のみ）ではトークンが read のみになり投稿に失敗するが、マージは止めない
    continue-on-error: true
    permissions:
      pull-requests: write  # PR にコメントする（checkout せず、PR のコードは動かさない）
    steps:
      - name: "計測結果を受け取る"
        if: needs.detect.outputs.targets != '[]'
        continue-on-error: true  # 全ての計測に失敗すると artifact が 1 つも無い
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bundle-size-*
          # artifact が 1 つだけだと path の直下、2 つ以上だと artifact ごとのディレクトリに置かれるため、直下にそろえる
          merge-multiple: true
          path: ${{ runner.temp }}/results

      # artifact が無い対象（ビルドの失敗、タイムアウトなど）は「計測できませんでした」にする
      - name: "コメントの本文を作る"
        shell: bash
        env:
          TARGETS: ${{ needs.detect.outputs.targets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -r '.[] | "\(.key)\t\(.dir)"' <<< "${TARGETS}" | while IFS=$'\t' read -r key dir; do
            printf '### 📦 %s\n\n' "${dir}"
            cat "${RUNNER_TEMP}/results/bundle-size-${key}.md" 2>/dev/null \
              || printf '⚠️ 計測できませんでした（ビルドの失敗やタイムアウトなど）。[ログ](%s)\n' "${RUN_URL}"
            echo
          done > "${RUNNER_TEMP}/body.md"
          [ -s "${RUNNER_TEMP}/body.md" ] || echo "このコミットではフロントエンドを変えていないため、バンドルサイズを計測していません。" > "${RUNNER_TEMP}/body.md"

      # 前回のコメント（github-actions[bot] が書いた、目印のあるもの）を更新する。
      # 計測していないのに前回のコメントも無いときは、何も書かない
      - name: "PR にコメント"
        shell: bash
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TARGETS: ${{ needs.detect.outputs.targets }}
          MARKER: "<!-- github-workflows/bundle-size -->"
        run: |
          set -euo pipefail
          body="$(cat "${RUNNER_TEMP}/body.md")"$'\n\n'"${MARKER}"
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains(env.MARKER))) | .id' | tail -n 1)
          if [ -n "${id}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="${body}" > /dev/null
          elif [ "${TARGETS}" != "[]" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="${body}" > /dev/null
          fi
