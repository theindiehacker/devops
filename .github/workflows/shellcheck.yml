name: "🐚 shellcheck"

# シェルスクリプトを shellcheck で lint する。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「シェルスクリプトが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では lint を skip し、run 全体は success になる
#    （ルールセットが All repositories 適用のため、対象外の PR でも合格できる必要がある）。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: shellcheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: "シェルスクリプトを lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "lint 対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          list-files: json
          # 削除ファイルは lint できないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            scripts:
              - added|modified|copied: "**/*.sh"
              - added|modified|copied: "**/*.bash"
              - added|modified|copied: "**/*.ksh"

      - name: "Checkout"
        if: steps.filter.outputs.scripts == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install shellcheck"
        if: steps.filter.outputs.scripts == 'true'
        shell: bash
        env:
          # renovate: datasource=github-release-attachments depName=koalaman/shellcheck
          VERSION: v0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          ARCHIVE="shellcheck-${VERSION}.linux.x86_64.tar.xz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/koalaman/shellcheck/releases/download/${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo tar -xJ -C /usr/local/bin -f "$ARCHIVE" --strip-components=1 "shellcheck-${VERSION}/shellcheck"
          rm -f "$ARCHIVE"
          shellcheck --version

      - name: "shellcheck"
        if: steps.filter.outputs.scripts == 'true'
        shell: bash
        env:
          TARGETS: ${{ steps.filter.outputs.scripts_files }}
        run: |
          set -euo pipefail
          targets=()
          while IFS= read -r t; do
            if [ -n "${t}" ]; then targets+=("${t}"); fi
          done < <(jq -r '.[]' <<< "${TARGETS}")

          result="${RUNNER_TEMP}/shellcheck.json"
          code=0
          shellcheck --severity=warning --external-sources --format=json1 "${targets[@]}" > "${result}" || code=$?

          # 検出箇所を PR に annotation 表示する
          jq -r '.comments[]
            | "::\(if .level == "error" then "error" else "warning" end) file=\(.file),line=\(.line),col=\(.column)::shellcheck (SC\(.code)): \(.message)"' "${result}"
          exit "${code}"
