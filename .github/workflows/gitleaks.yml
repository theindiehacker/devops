name: "🛡️ Gitleaks"

# PR で追加したコミットのシークレットを gitleaks で検知する。検査の中身は devops の Taskfile.yml の security:check:gitleaks。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: gitleaks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: "シークレット検知"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Gitleaks スキャン"
        uses: theindiehacker/devops/.github/actions/task@main
        env:
          # PR の base..head 差分のみスキャン
          LOG_OPTS: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        with:
          task: security:check:gitleaks
