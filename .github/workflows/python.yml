name: "🐍 python"

# Python のコードと依存管理を検査する。
# ⚠️ 必須ワークフローは on: のフィルタが無視され全 PR で起動するため、対象の判定は detect ジョブで行う
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: python-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # ツール版は対象 repo の宣言を読まず中央で固定する（2 桁の版が float に化けないよう引用符で囲む）
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.13.4"
  # renovate: datasource=pypi depName=ruff
  RUFF_VERSION: "0.17.1"
  # renovate: datasource=pypi depName=pyright
  PYRIGHT_VERSION: "1.1.414"
  # renovate: datasource=pypi depName=import-linter
  IMPORT_LINTER_VERSION: "2.15"
  # renovate: datasource=pypi depName=deptry
  DEPTRY_VERSION: "0.25.1"

jobs:
  detect:
    name: "検査対象を検出"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter の変更ファイル一覧取得に必要
    outputs:
      python: ${{ steps.filter.outputs.python }}
      # uv.lock のあるディレクトリの JSON 配列（例: [".", "backend"]）
      projects: ${{ steps.assign.outputs.projects || '[]' }}
      # プロジェクトごとの、別の uv.lock を持つ入れ子のプロジェクト（そのプロジェクトからの相対パス）の JSON オブジェクト（例: {".": ["backend"], "backend": []}）
      nested: ${{ steps.assign.outputs.nested || '{}' }}
      # 検査対象を担当プロジェクト（project）とそこからの相対パス（rel）に割り当てた JSON 配列。
      # project が空なら、どの uv.lock の配下にも無く検査できない
      pyprojects: ${{ steps.assign.outputs.pyprojects || '[]' }}
      importlinters: ${{ steps.assign.outputs.importlinters || '[]' }}
    steps:
      - name: "検査の要否を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # 削除も対象（削除したモジュールを import する側や、設定の削除で結果が変わる）
          filters: |
            python:
              - "**/*.py"
              - "**/*.pyi"
              - "**/ruff.toml"
              - "**/.ruff.toml"
              - "**/pyproject.toml"
              # pyrightconfig.json と、extends で読む共有の設定（この名前にすれば変更で検査が動く）
              - "**/pyright*.json"
              - "**/setup.cfg"
              - "**/.importlinter"
              - "**/uv.lock"
              - "**/uv.toml"
              - "**/.python-version"
              - "**/*requirements*.txt"
              - "**/requirements/*.txt"
              - "**/Pipfile"
              - "**/Pipfile.lock"
              - "**/poetry.lock"
              - "**/pdm.lock"

      - name: "Checkout"
        if: steps.filter.outputs.python == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "検査対象を割り当てる"
        id: assign
        if: steps.filter.outputs.python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # 「どのディレクトリがどの uv.lock に属するか」の判定はこの step に一本化する
          # （各ジョブで同じ探索を書くと、片方だけ直したときに規約の判定と検査範囲が食い違う）

          # プロセス置換では git の失敗が伝わらないため、pipefail の効くパイプラインで受ける（該当なしは [] になる）。
          # -z のまま渡す（改行や非 ASCII を含むパスが壊れるため）
          json=$(git ls-files -z -- ':(glob)**/uv.lock' | jq -Rsc 'split("\u0000")[:-1] | map(sub("/?uv\\.lock$"; "") | if . == "" then "." else . end)')
          echo "projects=${json}" >> "${GITHUB_OUTPUT}"
          json=$(jq -c '. as $all | map(. as $p | {key: $p, value: [$all[] | select(. != $p) | if $p == "." then . elif startswith($p + "/") then ltrimstr($p + "/") else empty end]}) | from_entries' <<< "${json}")
          echo "nested=${json}" >> "${GITHUB_OUTPUT}"

          # 最も近い祖先の uv.lock のディレクトリ。どこにも無ければ空
          owner() {
            local dir=$1
            while [ ! -e "${dir}/uv.lock" ] && [ "${dir}" != . ]; do dir=$(dirname "${dir}"); done
            if [ -e "${dir}/uv.lock" ]; then printf '%s' "${dir}"; fi
          }
          assign() {
            local path dir project rel
            while IFS= read -r -d '' path; do
              dir=$(dirname "${path}")
              project=$(owner "${dir}")
              if [ "${dir}" = "${project}" ]; then rel=.; else rel=${dir#"${project}/"}; fi
              jq -nc --arg path "${path}" --arg project "${project}" --arg rel "${rel}" '$ARGS.named'
            done < "$1" | jq -sc .
          }

          # git grep は該当なしで 1 を返すため、それ以外の失敗だけを止める
          files=$(mktemp)
          git grep -lzE '^\[(project|tool\.poetry|tool\.uv\.workspace)\]' -- ':(glob)**/pyproject.toml' > "${files}" || [ "$?" -eq 1 ]
          json=$(assign "${files}")
          echo "pyprojects=${json}" >> "${GITHUB_OUTPUT}"

          git grep -lzE '^\[(tool\.)?importlinter\]' -- ':(glob)**/pyproject.toml' ':(glob)**/setup.cfg' ':(glob)**/.importlinter' > "${files}" || [ "$?" -eq 1 ]
          json=$(assign "${files}")
          echo "importlinters=${json}" >> "${GITHUB_OUTPUT}"

  rule:
    name: "📜 規約を検査"
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # git 上のファイルだけを見て判定する（対象 repo のコードは動かさない）
      - name: "uv で依存を管理しているか"
        shell: bash
        env:
          PYPROJECTS: ${{ needs.detect.outputs.pyprojects }}
          IMPORTLINTERS: ${{ needs.detect.outputs.importlinters }}
        run: |
          set -euo pipefail
          # 対象 repo 由来のパスをそのまま埋めるとワークフローコマンドを偽装できるためエスケープする
          escape() { local value=${1//%/%25}; value=${value//$'\r'/%0D}; printf '%s' "${value//$'\n'/%0A}"; }
          escape_property() { local value; value=$(escape "$1"); value=${value//:/%3A}; printf '%s' "${value//,/%2C}"; }
          status=0
          # requirements 系は依存管理として使われているものだけを対象にする
          # （pyproject.toml がある repo ではその隣にあるもの、無い repo は Python コードがあるときだけ）
          manifests=$(git ls-files -- ':(glob)**/pyproject.toml')
          sources=$(git ls-files -- ':(glob)**/*.py' ':(glob)**/*.pyi')
          # プロセス置換では git の失敗が伝わらないため、いったんファイルに受ける。
          # 対象を増やすときは detect の paths フィルタにも追加する（フィルタから漏れると起動しない）
          files=$(mktemp)
          git ls-files -z -- ':(glob)**/*requirements*.txt' ':(glob)**/requirements/*.txt' ':(glob)**/setup.py' ':(glob)**/setup.cfg' ':(glob)**/Pipfile' ':(glob)**/Pipfile.lock' ':(glob)**/poetry.lock' ':(glob)**/pdm.lock' > "${files}"
          while IFS= read -r -d '' file; do
            dir=$(dirname "${file}")
            case "${file}" in
              *requirements/*.txt|*requirements*.txt)
                # requirements/ に分けている場合は、その親を宣言の置き場所とみなす
                case "${file}" in *requirements/*.txt) dir=$(dirname "${dir}") ;; esac
                if [ -n "${manifests}" ]; then
                  if [ ! -e "${dir}/pyproject.toml" ]; then continue; fi
                elif [ -z "${sources}" ]; then
                  continue
                fi
                # uv export で書き出したものは配布用の成果物として許可する
                IFS= read -r first < "${file}" || true
                case "${first}" in *'autogenerated by uv'*) continue ;; esac ;;
              # 依存を宣言しない setup.py / setup.cfg は、ビルド定義（C 拡張等）や他ツールの設定として許可する
              setup.py|setup.cfg|*/setup.py|*/setup.cfg)
                if ! grep -qE '(install|setup)_requires' "${file}"; then continue; fi ;;
            esac
            echo "::error file=$(escape_property "${file}")::$(escape "${file}") ではなく pyproject.toml と uv.lock で依存を管理してください（https://docs.astral.sh/uv/guides/migration/pip-to-project/）"
            status=1
          done < "${files}"
          # 自分の uv.lock を持つか、祖先の lock に記録されている（= workspace の member である）ことを確認する。
          # lock が最新かは依存関係の導入時に uv が判定する
          jq -j '.[] | .path, "\u0000", .project, "\u0000", .rel, "\u0000"' <<< "${PYPROJECTS}" > "${files}"
          while IFS= read -r -d '' path && IFS= read -r -d '' project && IFS= read -r -d '' rel; do
            if [ -z "${project}" ]; then
              echo "::error file=$(escape_property "${path}")::uv.lock がありません。uv lock を実行して uv.lock をコミットしてください（https://docs.astral.sh/uv/concepts/projects/layout/#the-lockfile）"
              status=1
            elif [ "${rel}" != . ] && ! grep -qsF -e "editable = \"${rel}\"" -e "virtual = \"${rel}\"" -e "directory = \"${rel}\"" "${project}/uv.lock"; then
              echo "::error file=$(escape_property "${path}")::uv.lock に含まれていません。uv lock を実行して uv.lock をコミットするか、workspace の members に追加してください（https://docs.astral.sh/uv/concepts/projects/workspaces/）"
              status=1
            fi
          done < "${files}"
          # どの uv.lock にも属さない import-linter の設定は、検査に使う環境を作れないため誰も検査できない
          jq -j '.[] | select(.project == "") | .path, "\u0000"' <<< "${IMPORTLINTERS}" > "${files}"
          while IFS= read -r -d '' path; do
            echo "::error file=$(escape_property "${path}")::import-linter の設定がどの uv.lock の配下にもないため検査できません。pyproject.toml と uv.lock で依存を管理してください（https://docs.astral.sh/uv/guides/migration/pip-to-project/）"
            status=1
          done < "${files}"
          exit "${status}"

  ruff:
    name: "✏️ ruff"
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "✏️ ruff check"
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: ${{ env.RUFF_VERSION }}
          args: "check --no-fix --output-format=github"
          # 既定は ${{ github.workspace }}（絶対パス）で、annotation が PR の差分に貼られない
          src: "."

      # 前の step の action が ruff を PATH に入れる
      - name: "✏️ ruff format"
        if: ${{ !cancelled() }}
        shell: bash
        run: ruff format --check --diff

      # bandit 相当の S ルールを、対象 repo の select / ignore に関わらず必ず検査する（--select が設定を上書きする）。
      # 誤検知は # noqa: Sxxx か per-file-ignores で個別に外す。S101（assert）はテストで多用され誤検知が大半のため除く
      - name: "🛡️ ruff security"
        if: ${{ !cancelled() }}
        shell: bash
        run: ruff check --no-fix --output-format=github --select S --ignore S101

  pyproject:
    name: "🚧 型・依存関係を検査 (${{ matrix.project }})"
    needs: detect
    if: needs.detect.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.projects) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.project }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        id: uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: ${{ matrix.project }}
          enable-cache: true
          # 既定の glob は pyproject.toml 等も含み、依存と無関係な変更でキャッシュが無効になる。
          # pyproject.toml との一致は uv lock --check で強制しているため lock だけで足りる
          cache-dependency-glob: uv.lock
          cache-suffix: python-${{ env.UV_VERSION }}

      - name: "uv.lock が pyproject.toml と一致しているか"
        run: uv lock --check

      # 以降の step は !cancelled() で暗黙の success() を外し、前段が fail しても 3 ツールの結果を 1 run で出す

      - name: "🧰 依存関係を導入"
        id: deps
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        run: |
          set -euo pipefail
          # workspace の全メンバー・extras・dependency-groups まで入れる（不足すると Pyright / deptry が誤検知する）
          if uv sync --frozen --all-packages --all-extras --all-groups; then exit 0; fi
          echo "::warning::extras を含めた uv sync に失敗したため extras を除いて検査します（extras 限定の依存は Pyright / deptry が誤検知することがあります）"
          # 導入できなければ検査を skip せず fail させる（緑のまま「何も検査していない」状態を作らないため）
          uv sync --frozen --all-packages --all-groups || { echo "::error::uv sync に失敗しました。ランナーで依存を導入できない repo の扱いは docs/SETUP.md「✏️ スタイルチェック」の例外運用を参照してください"; exit 1; }

      # 検査対象と厳しさは、このプロジェクト（uv.lock のあるディレクトリ）の [tool.pyright] / pyrightconfig.json に委ねる
      # （位置引数を渡すと設定の include が無視される。mypy と同じく、workspace のメンバーの設定は読まれない）。
      # -p .: このディレクトリに設定があればそれを使う（無ければ親の pyrightconfig.json が使われるため、下で書き出す）。
      # Pyright の wheel は本体を同梱しており、Node.js はランナーのものを使う（実行時に npm から取得しない）
      - name: "🧱 Pyright - 型チェック"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          NESTED: ${{ needs.detect.outputs.nested }}
          PROJECT: ${{ matrix.project }}
          # 版の更新の確認（毎回の PyPI への問い合わせと警告）をしない。版は Renovate が上げる
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
        run: |
          set -euo pipefail
          # 別の uv.lock を持つ入れ子のプロジェクト（自分の matrix で検査される）。どれがどの uv.lock に属するかは detect が決める
          nested=$(jq -c --arg project "${PROJECT}" '.[$project] // []' <<< "${NESTED}")
          # 設定の有無は、pyproject.toml を TOML として読み（サブテーブル・ドット付きのキーなど、どの書き方でも拾う）、setup.cfg は見出しの行を探して判定する。
          # ランナーの Python（3.11 以上）で読む。-I: カレントディレクトリ（対象 repo）のモジュールを import しない。
          # 終了コード: 0 = ある、10 = 無い、それ以外 = 読めなかった
          has_tool() { # <pyproject.toml の [tool] の下の名前>
            [ -e pyproject.toml ] || return 10
            python3 -I -c 'import sys, tomllib; sys.exit(0 if sys.argv[1] in tomllib.load(open("pyproject.toml", "rb")).get("tool", {}) else 10)' "$1"
          }
          has_mypy_cfg() { # setup.cfg の [mypy] / [mypy-xxx]。configparser が読めない書き方（見出しの前の行など）でも拾えるよう、見出しの行を探す
            [ -e setup.cfg ] || return 10
            python3 -I -c 'import re, sys; sys.exit(0 if any(re.match(r"\s*\[mypy(-[^]]*)?\]", line) for line in open("setup.cfg", encoding="utf-8", errors="replace")) else 10)'
          }
          # 利用者の設定があれば書き換えない（入れ子のプロジェクトを除くかも利用者に任せ、落ちたときに案内する）
          generated=false
          if [ -e pyrightconfig.json ]; then
            config="pyrightconfig.json"
          else
            # pyrightconfig.json が無ければ [tool.pyright] が読まれる。案内もそこを指す
            config="pyproject.toml の [tool.pyright]"
            pyright_config=0
            has_tool pyright || pyright_config=$?
            if [ "${pyright_config}" -ne 0 ] && [ "${pyright_config}" -ne 10 ]; then
              # 読めないときは、利用者の [tool.pyright] を上書きしないよう設定を書き出さない
              echo "::warning::Pyright: pyproject.toml を読めませんでした。[tool.pyright] があるか判定できないため、そのまま検査します"
            fi
            if [ "${pyright_config}" -eq 10 ]; then
              if [ -e mypy.ini ] || [ -e .mypy.ini ] || has_tool mypy || has_mypy_cfg; then
                echo "::warning::Pyright: mypy の設定は使われません。検査対象や厳しさは pyproject.toml の [tool.pyright] に移してください（https://microsoft.github.io/pyright/#/configuration）"
              fi
              # 設定が無いと、-p . でも親ディレクトリの pyrightconfig.json が使われ、ディレクトリ全体が検査される。
              # このプロジェクトの設定を書き出し、入れ子のプロジェクトを除く（既定の除外 node_modules・隠しディレクトリなどは残る）
              jq -n --argjson nested "${nested}" '{exclude: $nested}' > pyrightconfig.json
              generated=true
            fi
          fi
          # 一度だけ導入し、導入の失敗を型エラー（exit 1）と取り違えないようにする。
          # 実行はプロジェクトの環境（uv run）で行い、import をプロジェクトの依存で解決させる
          if ! uv tool install --quiet "pyright==${PYRIGHT_VERSION}"; then
            echo "::error::Pyright: pyright ${PYRIGHT_VERSION} を導入できませんでした。上の uv のエラーを確かめてください"
            exit 1
          fi
          pyright="$(uv tool dir --bin)/pyright"
          log=$(mktemp)
          status=0
          # 存在しないパスの警告などは標準エラーに出るため、ログに入れる。--stats: 検査したファイルの数を出させる（0 件の判定に使う）
          uv run --no-sync "${pyright}" -p . --stats 2>&1 | tee "${log}" || status=$?
          # Pyright は include のパスが無くても 0 で終わる。何も検査しないまま通らないよう落とす（mypy も落ちていた）
          if [ "${status}" -eq 0 ] && grep -q ' does not exist\.$' "${log}"; then
            echo "::error::Pyright: ${config} の include に存在しないパスがあります。検査されないファイルが出ないよう直してください（https://microsoft.github.io/pyright/#/configuration）"
            exit 1
          fi
          # 設定の打ち間違い（知らない設定・不正な値・executionEnvironments の中の誤り）も、Pyright はその設定を無視して検査し、型エラーが無ければ 0 で終わる。
          # "$schema"（エディタの補完に使う JSON Schema のキー）は Pyright が知らない設定として出すが、正しい設定なので除く
          # shellcheck disable=SC2016 # "$schema" は展開せず、そのままの文字列として探す
          if grep -E '^Config (contains unrecognized setting|"|executionEnvironments index [0-9]+: )' "${log}" | grep -vqF 'unrecognized setting "$schema"'; then
            echo "::error::Pyright: ${config} に、知らない設定か不正な値があります。上の Config の行を確かめて直してください（https://microsoft.github.io/pyright/#/configuration）"
            [ "${status}" -ne 0 ] || exit 1
          fi
          # 利用者の設定で検査するファイルが 1 つも無いときも 0 で終わる（mypy は落ちていた）。
          # 書き出した設定では、コードがすべて入れ子のプロジェクトにあり 0 件のことがあるため落とさない。
          # include の項目ごとの 0 件（ほかの項目にファイルがある）は、項目ごとの一覧が要るため見ない。
          # これらの判定は Pyright の出力の文言に頼るため、PYRIGHT_VERSION を上げたら文言が変わっていないか確かめる
          if [ "${status}" -eq 0 ] && [ "${generated}" = false ] && grep -q '^No source files found\.$' "${log}"; then
            echo "::error::Pyright: ${config} の include / exclude に当てはまる Python ファイルがありません。検査されないファイルが出ないよう直してください（https://microsoft.github.io/pyright/#/configuration）"
            exit 1
          fi
          # ラッパー（pyright-python）が Pyright を起動できないときも 1 で終わる。Pyright は必ず集計の行を出すため、無ければ実行時のエラーとして扱う
          if [ "${status}" -eq 1 ] && ! grep -qE '^[0-9]+ errors?, [0-9]+ warnings?, [0-9]+ informations?$' "${log}"; then
            status=2
          fi
          case "${status}" in
            0) ;;
            1)
              keep=""
              if [ "${generated}" = true ] && [ "${nested}" != "[]" ]; then
                # 書き出した設定にしか入れ子のプロジェクトの除外が無いため、利用者が設定を書くときに残すよう伝える
                keep="（設定を書くときは、入れ子のプロジェクト $(jq -r 'join(", ") | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' <<< "${nested}") も exclude に入れてください）"
              fi
              echo "::error::Pyright: 型エラーを直してください。検査から外すディレクトリ（scripts/ など）は ${config} の include / exclude で絞れます${keep}（https://microsoft.github.io/pyright/#/configuration）"
              # 入れ子のプロジェクトのファイルに指摘があれば、このプロジェクトの環境で検査されている（除外できていない）
              unchecked=$(jq -c --arg pwd "${PWD}" --rawfile log "${log}" '[.[] | select(. as $dir | $log | split("\n") | any(contains($pwd + "/" + $dir + "/") and test(" - (error|warning): ")))]' <<< "${nested}")
              if [ "${unchecked}" != "[]" ]; then
                # パスは対象 repo 由来のため、ワークフローコマンドとしてエスケープする
                echo "::error::Pyright: 入れ子のプロジェクト（$(jq -r 'join(", ") | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' <<< "${unchecked}")）が、このプロジェクトの環境で検査されています。${config} の exclude に入れてください（それぞれ自分の環境で検査されます）"
              fi
              ;;
            *) echo "::error::Pyright: 型チェックを実行できませんでした（exit ${status}）。上のエラーと、${config} の書き方を確かめてください（https://microsoft.github.io/pyright/#/configuration）" ;;
          esac
          exit "${status}"

      - name: "➡️ lint-imports - モジュール依存関係を検査"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          IMPORTLINTERS: ${{ needs.detect.outputs.importlinters }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          # detect が自分に割り当てた設定だけを検査する（設定はプロジェクト直下とは限らない）
          configs=$(mktemp)
          jq -j --arg project "${PROJECT}" '.[] | select(.project == $project) | .rel, "\u0000"' <<< "${IMPORTLINTERS}" > "${configs}"
          if [ ! -s "${configs}" ]; then
            echo "::notice::このプロジェクトに割り当てられた import-linter の設定が無いため skip"
            exit 0
          fi
          status=0
          while IFS= read -r -d '' dir; do
            echo "::group::${dir//$'\n'/%0A}"
            uv run --directory "${dir}" --no-sync --with "import-linter==${IMPORT_LINTER_VERSION}" lint-imports --no-cache --no-logo || status=1
            echo "::endgroup::"
          done < "${configs}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::lint-imports: 「Could not find package」が出る場合は、pyproject.toml に [build-system] を宣言して自パッケージを導入するか、root_package を実在するパッケージに合わせてください（https://import-linter.readthedocs.io/en/stable/usage.html）"
          fi
          exit "${status}"

      - name: "🗑️ deptry - 不要なパッケージを検知"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -euo pipefail
          # uv workspace は、依存を宣言する単位であるメンバーごとに検査する（[project] を持たない virtual root は列挙されない）
          workspace=$(uv workspace list --paths)
          if [ -z "${workspace}" ]; then
            echo "::notice::workspace にメンバーが無いため skip"
            exit 0
          fi
          status=0
          while IFS= read -r member; do
            # workspace ルートの deptry . は配下メンバーのソースまで走査するため、他のメンバーを除外する
            args=()
            while IFS= read -r other; do
              case "${other}" in "${member}"/*) args+=(--extend-exclude "^${other#"${member}/"}/") ;; esac
            done <<< "${workspace}"
            echo "::group::${member}"
            uv run --directory "${member}" --no-sync --with "deptry==${DEPTRY_VERSION}" deptry . "${args[@]}" || status=1
            echo "::endgroup::"
          done <<< "${workspace}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::deptry: 自プロジェクトのパッケージ（src/ や app/ 配下など）が DEP001 / DEP003 になる場合は pyproject.toml の [tool.deptry] known_first_party に（https://deptry.com/usage/#known-first-party）、別の uv.lock を持つ入れ子のプロジェクトなど検査から外すディレクトリは extend_exclude に（https://deptry.com/usage/#extend-exclude）追加してください。その他の違反の対処は https://deptry.com/rules-violations/ を参照してください"
          fi
          exit "${status}"
