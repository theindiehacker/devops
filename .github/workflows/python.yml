name: "🐍 python"

# Python のコードと依存管理を検査する。検査の中身は devops の Taskfile.yml の style:check:python:* / security:check:ruff。
# ⚠️ 必須ワークフローは on: のフィルタが無視され全 PR で起動するため、対象の判定は job 内で行う
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: python-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: "Python を検査"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "検査の要否を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # 削除も対象（削除したモジュールを import する側や、設定の削除で結果が変わる）
          filters: |
            python:
              - "**/*.py"
              - "**/*.pyi"
              - "**/ruff.toml"
              - "**/.ruff.toml"
              - "**/pyproject.toml"
              - "**/mypy.ini"
              - "**/.mypy.ini"
              - "**/setup.cfg"
              - "**/.importlinter"
              - "**/uv.lock"
              - "**/uv.toml"
              - "**/.python-version"
              - "**/*requirements*.txt"
              - "**/requirements/*.txt"
              - "**/Pipfile"
              - "**/Pipfile.lock"
              - "**/poetry.lock"
              - "**/pdm.lock"

      - name: "Checkout"
        if: steps.filter.outputs.python == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 以降の step は !cancelled() で暗黙の success() を外し、前段が fail しても全ての結果を 1 run で出す
      - name: "📜 uv で依存を管理しているか"
        if: steps.filter.outputs.python == 'true'
        uses: theindiehacker/devops/.github/actions/task@main
        with:
          task: style:check:python:rule

      - name: "✏️ ruff"
        if: ${{ !cancelled() && steps.filter.outputs.python == 'true' }}
        uses: theindiehacker/devops/.github/actions/task@main
        with:
          task: style:check:python:ruff

      - name: "🛡️ ruff security"
        if: ${{ !cancelled() && steps.filter.outputs.python == 'true' }}
        uses: theindiehacker/devops/.github/actions/task@main
        with:
          task: security:check:ruff

      - name: "🚧 型・依存関係"
        if: ${{ !cancelled() && steps.filter.outputs.python == 'true' }}
        uses: theindiehacker/devops/.github/actions/task@main
        with:
          task: style:check:python:types
