name: "🔷 typescript"

# TypeScript を Bun + Biome + knip + tsc で検査する。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「TypeScript 関連ファイルが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では検査を skip し、run 全体は success になる
#    （ルールセットが All repositories 適用のため、TypeScript 未使用の repo でも合格できる必要がある）。
#
# Required workflow は対象 repo から inputs を受け取れないため、検査対象は規約ベースで検出する:
#   - 導入単位 = 祖先に package.json を持たない最上位の package.json のディレクトリ。monorepo（workspaces）
#     ではルート 1 箇所、frontend/ と tools/ のように独立プロジェクトが並ぶ構成では各々が単位になる
#   - 型チェック単位 = tsconfig.json のあるディレクトリ（workspace ごとの tsconfig.json も個別に検査する）
#   - node_modules / .git は探索対象外
#   - 導入単位が 0 件なら bun の導入ごと skip し、run 全体は success になる
#
# 対象 repo に求める前提: bun.lock をコミットし、biome / knip / typescript を devDependencies に持つこと。
# bun 本体は対象 repo の指定ではなく中央で固定し、SHA-256 検証つきで導入する。
#
# bun install が失敗した場合のみ後続を skip する。biome / knip / tsc は互いに独立して実行するため、
# 1 回の run で全ての違反が出揃う。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: typescript-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: "TypeScript を検査"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "検査対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # 3 つのツールの入力を全て覆う必要がある。Biome / knip は JS も解析対象のため .js 系を含め、
          # tsconfig.base.json のような extends 先も拾えるよう tsconfig*.json で受ける
          filters: |
            typescript:
              - "**/*.ts"
              - "**/*.tsx"
              - "**/*.mts"
              - "**/*.cts"
              - "**/*.js"
              - "**/*.jsx"
              - "**/*.mjs"
              - "**/*.cjs"
              - "**/package.json"
              - "**/bun.lock"
              - "**/bun.lockb"
              - "**/bunfig.toml"
              - "**/tsconfig*.json"
              - "**/biome.json"
              - "**/biome.jsonc"
              - "**/knip.json"
              - "**/knip.jsonc"

      - name: "Checkout"
        if: steps.filter.outputs.typescript == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "検査対象を収集"
        id: collect
        if: steps.filter.outputs.typescript == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # 導入単位。package.json を見つけた時点で -prune し、その配下は単位として数えない
          find . \( -path ./.git -o -name node_modules \) -prune -o \
            -type d -exec test -e '{}/package.json' ';' -print -prune \
            | sed 's|^\./||' | sort > "${RUNNER_TEMP}/roots.txt"
          # 型チェック単位（-printf '%h' は tsconfig.json のあるディレクトリ）
          find . \( -path ./.git -o -name node_modules \) -prune -o \
            -name tsconfig.json -printf '%h\n' \
            | sed 's|^\./||' | sort > "${RUNNER_TEMP}/tsconfigs.txt"
          cat "${RUNNER_TEMP}/roots.txt" "${RUNNER_TEMP}/tsconfigs.txt"

          if [ -s "${RUNNER_TEMP}/roots.txt" ]; then
            echo "roots=true" >> "${GITHUB_OUTPUT}"
          else
            echo "roots=false" >> "${GITHUB_OUTPUT}"
          fi

          # 収集した各ディレクトリで引数のコマンドを実行する共通ヘルパ。
          # 1 つ失敗しても残りは続行し、最後に 1 を返す
          cat > "${RUNNER_TEMP}/each" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          list="$1"; shift
          status=0
          while IFS= read -r dir; do
            if [ -z "${dir}" ]; then continue; fi
            echo "::group::${dir}"
            (cd "${dir}" && "$@") || status=1
            echo "::endgroup::"
          done < "${list}"
          exit "${status}"
          SH
          chmod +x "${RUNNER_TEMP}/each"

      - name: "Install bun"
        if: steps.collect.outputs.roots == 'true'
        shell: bash
        env:
          # renovate: datasource=github-release-attachments depName=oven-sh/bun
          VERSION: bun-v1.4.2
          SHA256: 36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913
        run: |
          set -euo pipefail
          ARCHIVE="bun-linux-x64.zip"
          curl -sSfL -o "$ARCHIVE" "https://github.com/oven-sh/bun/releases/download/${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo unzip -o -j "$ARCHIVE" "bun-linux-x64/bun" -d /usr/local/bin
          sudo chmod +x /usr/local/bin/bun
          rm -f "$ARCHIVE"
          bun --version

      - name: "bun install"
        id: install
        if: steps.collect.outputs.roots == 'true'
        shell: bash
        run: '"${RUNNER_TEMP}/each" "${RUNNER_TEMP}/roots.txt" bun install --frozen-lockfile'

      - name: "biome ci"
        # 検出箇所を PR に annotation 表示する（--reporter=github）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: '"${RUNNER_TEMP}/each" "${RUNNER_TEMP}/roots.txt" bun run biome ci --reporter=github .'

      - name: "knip"
        # 未使用パッケージの検知に絞る（unused files / exports は対象外）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: '"${RUNNER_TEMP}/each" "${RUNNER_TEMP}/roots.txt" bun run knip --dependencies'

      - name: "tsc"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: '"${RUNNER_TEMP}/each" "${RUNNER_TEMP}/tsconfigs.txt" bun run tsc --noEmit'
