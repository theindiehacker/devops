name: "🔷 typescript"

# TypeScript を Bun + Biome + knip + tsc で検査する。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「TypeScript 関連ファイルが変更されたか」の判定は本ワークフロー内で行う。
#    対象ファイルの変更がない PR では検査を skip し、run 全体は success になる
#    （ルールセットが All repositories 適用のため、TypeScript 未使用の repo でも合格できる必要がある）。
#
# 検査の中身（導入単位・型チェック単位の検出、biome の共通設定）は devops の Taskfile.yml の style:check:typescript。
# 対象 repo に求める前提: bun.lock をコミットし、knip / typescript を devDependencies に持つこと。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: typescript-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: "TypeScript を検査"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "検査対象を判定"
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # 3 つのツールの入力を全て覆う必要がある。Biome / knip は JS も解析対象のため .js 系を含め、
          # tsconfig.base.json のような extends 先も拾えるよう tsconfig*.json で受ける
          filters: |
            typescript:
              - "**/*.ts"
              - "**/*.tsx"
              - "**/*.mts"
              - "**/*.cts"
              - "**/*.js"
              - "**/*.jsx"
              - "**/*.mjs"
              - "**/*.cjs"
              - "**/package.json"
              - "**/bun.lock"
              - "**/bun.lockb"
              - "**/bunfig.toml"
              - "**/tsconfig*.json"
              - "**/biome.json"
              - "**/biome.jsonc"
              - "**/knip.json"
              - "**/knip.jsonc"

      - name: "Checkout"
        if: steps.filter.outputs.typescript == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "TypeScript を検査"
        if: steps.filter.outputs.typescript == 'true'
        uses: theindiehacker/devops/.github/actions/task@main
        with:
          task: style:check:typescript
