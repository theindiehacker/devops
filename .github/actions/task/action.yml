name: "devops task"
description: "devops の .github/Taskfile.yml のタスクを、呼び出し元リポジトリの checkout に対して実行する"

# 必須ワークフローから `uses: theindiehacker/devops/.github/actions/task@main` で呼ぶ。
# action と一緒に devops の Taskfile / scripts / mise.toml / mise.lock も取得されるため、
# private な devops を clone するトークンは不要（devops の Actions access は organization）。
# ツールの版と checksum は devops の mise.lock だけで管理する（ワークフローに VERSION / SHA256 を書かない）。

inputs:
  task:
    description: "実行するタスク名（.github/Taskfile.yml のタスク。例: actionlint）"
    required: true
  tools:
    description: "mise で導入するツール（空白区切り。task も含める。例: task actionlint shellcheck）"
    required: true

runs:
  using: composite
  steps:
    - name: "mise を導入"
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
      with:
        version: 2026.9.15
        # ツールは次の step で devops の設定から入れる。呼び出し元の mise.toml（ツール・env・shim）は使わない
        working_directory: ${{ github.action_path }}/../../..
        install: false
        env: false
        add_shims_to_path: false
        cache: false

    - name: "task ${{ inputs.task }}"
      shell: bash
      # 呼び出し元の checkout（GITHUB_WORKSPACE）で実行する → Taskfile の REPO_ROOT が検査対象リポジトリになる
      working-directory: ${{ github.workspace }}
      env:
        TASK_NAME: ${{ inputs.task }}
        TOOLS: ${{ inputs.tools }}
        DEVOPS_DIR: ${{ github.action_path }}/../../..
        # mise.lock の URL / checksum に無いものは入れない
        MISE_LOCKED: "1"
      run: |
        set -euo pipefail
        read -ra tools <<< "${TOOLS}"
        # ツールは devops の mise.toml / mise.lock から入れる。
        # mise.toml の postinstall（lefthook install）は CI では失敗するが WARN のみで install は成功する
        mise --cd "${DEVOPS_DIR}" trust --quiet mise.toml
        mise --cd "${DEVOPS_DIR}" install "${tools[@]}"
        # 呼び出し元の mise.toml の版に引きずられないよう、shim ではなく devops の版の bin をこの step の PATH にだけ足す
        # （GITHUB_PATH に書くと後続 step の PATH を書き換えられるため使わない）
        bin_paths=$(mise --cd "${DEVOPS_DIR}" bin-paths "${tools[@]}" | paste -sd: -)
        PATH="${bin_paths}:${PATH}" task --taskfile "${DEVOPS_DIR}/.github/Taskfile.yml" "${TASK_NAME}"
