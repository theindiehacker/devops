name: "Trivy でスキャンするイメージを決定"
description: >-
  security.yml の scan-image の matrix を作る。.github/trivy-image.yml があれば列挙されたイメージを、
  無ければ Dockerfile を自動検出し、最終ステージ (ほかのステージから使われないステージ) をすべて対象にする

outputs:
  images:
    description: "scan-image の matrix に渡す JSON 配列 (dockerfile / context / target / build_args / label / suffix)"
    value: ${{ steps.images.outputs.images }}

runs:
  using: composite
  steps:
    - name: "スキャンするイメージを決定"
      id: images
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/images.sh"
