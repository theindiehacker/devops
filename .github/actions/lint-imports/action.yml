name: "lint-imports でモジュール依存関係を検査"
description: "プロジェクトに割り当てられた import-linter の設定を、プロジェクトの環境で検査する（uv と依存関係は事前に導入しておく）"

inputs:
  version:
    description: "import-linter（PyPI）の版"
    required: true
  project:
    description: "検査するプロジェクトのディレクトリ"
    required: true
  importlinters:
    description: "python-targets の出力 importlinters"
    required: true

runs:
  using: composite
  steps:
    - name: "lint-imports"
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        IMPORT_LINTER_VERSION: ${{ inputs.version }}
        PROJECT: ${{ inputs.project }}
        IMPORTLINTERS: ${{ inputs.importlinters }}
      run: bash "${GITHUB_ACTION_PATH}/lint-imports.sh"
