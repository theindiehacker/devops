name: "Semgrep でアプリケーションコードをスキャン"
description: "digest 固定の semgrep/semgrep イメージを docker run し、PR で新規に増えた severity ERROR の検出で失敗する"

inputs:
  version:
    description: "semgrep/semgrep イメージのタグ"
    required: true
  digest:
    description: "semgrep/semgrep イメージの digest (sha256:...)"
    required: true
  baseline:
    description: "--baseline-commit に渡すコミット（PR のマージ先）"
    required: true

runs:
  using: composite
  steps:
    - name: "Semgrep スキャン"
      shell: bash
      env:
        IMAGE: semgrep/semgrep:${{ inputs.version }}@${{ inputs.digest }}
        BASELINE: ${{ inputs.baseline }}
      run: bash "${GITHUB_ACTION_PATH}/semgrep.sh"
