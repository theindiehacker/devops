name: "Pyright で型チェック"
description: >-
  プロジェクト（uv.lock のあるディレクトリ）の環境で Pyright を実行する。検査対象と厳しさはプロジェクトの設定に委ね、
  設定が無ければ入れ子のプロジェクトを除いた設定を書き出す（uv と依存関係は事前に導入しておく）

inputs:
  version:
    description: "pyright（PyPI）の版"
    required: true
  project:
    description: "検査するプロジェクトのディレクトリ"
    required: true
  nested:
    description: "python-targets の出力 nested"
    required: true

runs:
  using: composite
  steps:
    - name: "Pyright"
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        PYRIGHT_VERSION: ${{ inputs.version }}
        PROJECT: ${{ inputs.project }}
        NESTED: ${{ inputs.nested }}
        # 版の更新の確認（毎回の PyPI への問い合わせと警告）をしない。版は Renovate が上げる
        PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
      run: bash "${GITHUB_ACTION_PATH}/pyright.sh"
