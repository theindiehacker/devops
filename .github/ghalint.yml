# ghalint のポリシー除外設定（変更には security チームの承認が必要: docs/SETUP.md 2.5）
excludes:
  # tag mode (track_progress / メンション起動) の claude-code-action は checkout が残す認証で PR ブランチを fetch するため
  # persist-credentials: true が必須。除外は当該 job に限定する
  - policy_name: checkout_persist_credentials_should_be_false
    workflow_file_path: .github/workflows/claude-code-review.yml
    job_name: code-review
  - policy_name: checkout_persist_credentials_should_be_false
    workflow_file_path: .github/workflows/claude-security-review.yml
    job_name: security-review
  - policy_name: checkout_persist_credentials_should_be_false
    workflow_file_path: .github/workflows/claude.yml
    job_name: claude
  # 必須ワークフローは devops 自身の composite action（Taskfile.yml を実行する）を @main で参照する。
  # 自分自身の SHA はそのコミットに書けないため、Taskfile.yml の変更を即座に CI へ反映するには branch で参照するしかない
  - policy_name: action_ref_should_be_full_length_commit_sha
    action_name: theindiehacker/devops/.github/actions/task
