version: '3'

silent: true

# GitHub Actions 関連のチェックはこの Taskfile が正。必須ワークフロー（.github/workflows/{actionlint,ghalint,zizmor}.yml）は
# composite action（.github/actions/task）経由でここのタスクを呼ぶだけにして、ローカルと CI の挙動を一致させる
vars:
  # 検査対象リポジトリのルート。CI では devops の action 配下ではなく呼び出し元の checkout を指す必要があるため、
  # Taskfile の位置ではなく task を起動したディレクトリから求める
  # ※ タスクの dir: に絶対パスを書くと、別の Taskfile から include されたときに include 元のパスと連結されて壊れるため、
  #   各コマンドの先頭で cd する
  REPO_ROOT:
    sh: git -C "{{.USER_WORKING_DIR}}" rev-parse --show-toplevel

tasks:
  default:
    cmd: task --list

  style:check:
    desc: ✏️️ スタイルチェック (actionlint)
    cmds:
      - task: actionlint

  security:check:
    desc: 🛡️ セキュリティチェック (ghalint / zizmor)
    cmds:
      - task: ghalint
      - task: zizmor

  actionlint:
    desc: 🧹 GitHub Actions ワークフローの静的解析
    # AI が読む前提で 1 エラー 1 行・ANSI カラーなしで出力する。
    # ワークフローが無いリポジトリでは actionlint が exit 3 になるため skip する（CI は paths-filter で skip される）
    cmd: |
      cd "{{.REPO_ROOT}}"
      if [ -n "$(find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null)" ]; then
        actionlint -oneline -no-color
      else
        echo "actionlint: .github/workflows にワークフローが無いため skip しました"
      fi

  ghalint:
    desc: 🛡️ GitHub Actions ワークフローのセキュリティチェック
    # 除外設定（.github/ghalint.yml 等）は自動探索される
    cmd: cd "{{.REPO_ROOT}}" && ghalint --log-color never run

  zizmor:
    desc: 🛡️ GitHub Actions のセキュリティ静的解析 (コード実行や情報漏洩などにつながる「実装上の危険なアンチパターン」を深く検知する)
    # 対象の列挙・インライン ignore 禁止・online 監査の振り分けがあるためスクリプトに分ける
    cmd: cd "{{.REPO_ROOT}}" && bash "{{.TASKFILE_DIR}}/scripts/zizmor.sh"
