version: '3'

silent: true

includes:
  github:
    taskfile: ./.github/Taskfile.yml

tasks:
  default:
    cmd: task --list

  init:
    desc: 🚀 セットアップ
    cmds:
      - echo "これからプロジェクトのセットアップを実施します🚀"
      # mise 未導入なら ~/.local/bin に入れる（導入直後は PATH に無いため、次の行で PATH に足して呼ぶ）
      - command -v mise >/dev/null || curl -fsSL https://mise.run | sh
      - PATH="$HOME/.local/bin:$PATH" mise install --yes  # mise をセットアップ
      - echo "done!✨"

  style:check:line:
    desc: ✏️ 1ファイルの行数チェック / 1ファイルが膨大になるということは何か問題がある
    internal: true
    cmd: |
      find . \
        \( -name "node_modules" -o -name "dist" -o -name "build" -o -name ".venv" \) -prune -o \
        -type f \( -name "*.ts" -o -name "*.py" \) \
        -exec awk 'FNR > 500 {print FILENAME " exceeds limit"; bad = 1; nextfile} END {exit bad}' {} +

  style:check:
    desc: ✏️ スタイルチェック
    deps:
      - style:check:line
      - github:style:check

  style:fix:
    desc: ✏️ スタイル自動修正

  security:check:
    desc: 🛡️ セキュリティチェック
    deps:
      - github:security:check
    cmds:
      # 🔑 gitleaks: シークレット情報が GitHub リポジトリに push されないようにする
      - gitleaks git --pre-commit --redact --staged --verbose --ignore-gitleaks-allow
