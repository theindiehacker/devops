version: '3'

silent: true

tasks:
  default:
    cmd: task --list

  init:
    desc: 🚀 セットアップ
    cmds:
      - echo "これからプロジェクトのセットアップを実施します🚀"
      # mise 未導入なら ~/.local/bin に入れる（導入直後は PATH に無いため、次の行で PATH に足して呼ぶ）
      - command -v mise >/dev/null || curl -fsSL https://mise.run | sh
      - PATH="$HOME/.local/bin:$PATH" mise install --yes  # mise をセットアップ
      - echo "done!✨"

  style:check:
    desc: ✏️ スタイルチェック

  style:fix:
    desc: ✏️ スタイル自動修正

  security:gitleaks:
    desc: 🛡️ セキュリティチェック / 🔑 シークレット情報の検知
    # lefthook から呼ばれたときは、コミット中のインデックス（SCAN_INDEX_FILE）を検査する
    cmd: GIT_INDEX_FILE="${SCAN_INDEX_FILE:-$(git rev-parse --git-path index)}" gitleaks git --pre-commit --redact --staged --verbose --ignore-gitleaks-allow

  security:check:
    desc: 🛡️ セキュリティチェック
    deps:
      - security:gitleaks
