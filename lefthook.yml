# git フックの登録（lefthook install）は mise.toml の postinstall フックで行う
pre-commit:
  # 前のジョブが落ちたら後続を打ち切る（整形前のコードを検証したりテストしたりしても意味がないため）
  piped: true
  commands:
    security:check:
      # git がフックに渡すリポジトリの場所の環境変数（GIT_INDEX_FILE、worktree では GIT_DIR も）を task に引き継ぐと、
      # remote の Taskfile を取る git が devops ではなくコミット中のリポジトリを操作してしまう
      # （インデックスに devops のファイルが混ざる、タグが見つからない）。まとめて外し、インデックスだけ SCAN_INDEX_FILE で受け渡す
      # 非対話の環境（GUI クライアント・Claude Code on the web）でも remote の Taskfile の信頼確認で止まらないよう --yes を付ける。
      # 参照先は各リポジトリがタグで固定しており、タグの更新は PR のレビューを通る
      run: env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE -u GIT_COMMON_DIR -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES SCAN_INDEX_FILE="${GIT_INDEX_FILE:-}" task --yes security:check
