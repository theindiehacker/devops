# git フックの登録（lefthook install）は mise.toml の postinstall フックで行う
pre-commit:
  # 前のジョブが落ちたら後続を打ち切る（整形前のコードを検証したりテストしたりしても意味がないため）
  piped: true
  commands:
    security:check:
      # git がフックに渡す GIT_INDEX_FILE を task に引き継ぐと、remote の Taskfile を取る git clone が
      # コミット中のインデックスに devops のファイルを書き込んでしまう。外して SCAN_INDEX_FILE で受け渡す
      # 非対話の環境（GUI クライアント・Claude Code on the web）でも remote の Taskfile の信頼確認で止まらないよう --yes を付ける。
      # 参照先は各リポジトリがタグで固定しており、タグの更新は PR のレビューを通る
      run: env -u GIT_INDEX_FILE SCAN_INDEX_FILE="${GIT_INDEX_FILE:-}" task --yes security:check
