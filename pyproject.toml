# 全リポジトリ共通の ruff / mypy の設定（Taskfile.yml の style:check:python:* / security:check:ruff / style:fix が使う）。
# 対象 repo の pyproject.toml / ruff.toml / mypy.ini の設定は読まない。repo 固有の例外は # noqa / # type: ignore[...] で個別に外す。
# 相対パス・glob は、検査を実行する repo のルートからの相対として解決される。

# ============ ✏️ ruff ============
[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4
# src レイアウトの自パッケージを first party として isort に認識させる
src = ["src", "."]
# 自動生成されるマイグレーションは検査しない
extend-exclude = ["__init__.py", "migration", "migrations"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "B008",     # 引数のデフォルトでの関数呼び出し（FastAPI の Depends / Query）
    "ERA001",   # コメントアウトしたコード
    "FIX002",   # TODO コメント
    "N818",     # 例外クラス名の Error 接尾辞
    "PLR0913",  # 引数の数（DI で協力者を受け取る設計が主）
    "PLR0917",  # 位置引数の数（PLR0913 と同じ理由）
    "RUF012",   # ミュータブルなクラス変数
    "TRY003",   # 長い例外メッセージ
    "FBT001",   # bool の位置引数
    "FBT002",   # bool のデフォルト位置引数
    "PLC0415",  # トップレベル以外での import
    "PLW0108",  # 前方参照のための lambda
    "A003",     # 組み込み名のフィールド（API の JSON 契約に合わせる）
    "CPY001",   # 著作権表記（LICENSE で一元管理する）
    "COM812",   # 末尾カンマ（ruff format と競合する）
    "D",        # docstring
    "TD",       # TODO の書式
    "ARG",      # 未使用の引数
    "EM",       # 例外メッセージの書式
]

[tool.ruff.lint.per-file-ignores]
# テストは日本語で仕様を書く（テスト名がそのまま仕様書になる）。assert は仕様そのもの
"**/{test,tests}/**/*.py" = [
    "S101", "SLF001", "PLR2004", "INP001", "N801", "N802", "N803", "N806", "N999",
    "PLC2401", "RUF001", "RUF002", "RUF003", "TC001", "TC002", "TC003", "DTZ011",
]
# 適合テストキットは利用側の pytest から呼ばれる公開 API
"**/testing/**/*.py" = ["S101", "PLR2004"]
# FastAPI 境界はアノテーションを実行時に解決するため、型限定 import を TYPE_CHECKING へ移せない
"**/port/adapter/resource/**/*.py" = ["TC001", "TC002", "TC003"]
"**/subscriber.py" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.pycodestyle]
max-line-length = 160

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
# 実行時にアノテーションを評価するため、TYPE_CHECKING へ移すと NameError になる
runtime-evaluated-decorators = ["injector.inject"]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings", "sqlalchemy.orm.DeclarativeBase"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]

# ============ 🧱 mypy ============
# 検査対象は uv プロジェクトごとの git 管理下の *.py / *.pyi（Taskfile.yml が渡す）。
# 次の 2 つはプロジェクトに合わせて Taskfile.yml が実行時に足す:
#   - mypy_path: src/ があれば MYPYPATH=src
#   - plugins: pydantic を import できれば pydantic.mypy（このテーブルの末尾に追記するため、[tool.mypy] はファイルの最後に置く）
[tool.mypy]
python_version = "3.14"
show_column_numbers = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true
strict_optional = false
explicit_package_bases = true
